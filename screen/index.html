<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%2316191d%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%274%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
<style>
/* ============================================================================================
   Loop Desk — premium surface. Gradients, glass, motion on scroll.
   Yellow.ai signature yellow used as light, not as paint: gradient meshes, glows, gradient
   borders and fills. Near-black stays the ink and the primary action, because a yellow approve
   button reads as a warning and fails contrast where someone signs off a production change.
   ============================================================================================ */
:root{
  --y:#FFCE00; --y-2:#FFB800; --y-3:#FFE066; --y-dk:#E0B400;
  --y-tint:#FFF8DB; --y-tint-2:#FFFCF0;
  --ink:#0C0F15; --ink-2:#464D57; --ink-3:#737B86; --ink-4:#9AA2AD;
  --bg:#FBFBF8; --surface:#FFFFFF; --rule:#E7E9ED; --rule-2:#F2F4F7;
  --good:#1B6B41; --good-bg:#EFF8F3; --good-rule:#C9E4D7;
  --warn:#8A5A09; --warn-bg:#FDF7E9; --warn-rule:#F0E1BD;
  --bad:#A62F1C; --bad-bg:#FDF2F0; --bad-rule:#F2D5CE;

  --grad-y:linear-gradient(135deg,#FFE066 0%,#FFCE00 45%,#FFB800 100%);
  --grad-ink:linear-gradient(150deg,#1A1F29 0%,#0C0F15 55%,#14100A 100%);
  --grad-line:linear-gradient(90deg,transparent,var(--y),transparent);
  --glass:rgba(255,255,255,.72);

  --sh-1:0 1px 2px rgba(12,15,21,.04),0 1px 1px rgba(12,15,21,.03);
  --sh-2:0 2px 6px rgba(12,15,21,.05),0 12px 34px rgba(12,15,21,.07);
  --sh-3:0 18px 56px rgba(12,15,21,.16);
  --glow:0 6px 28px rgba(255,184,0,.30);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px; --r-ctl:10px;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* the ambient mesh: two soft yellow lights that drift as you scroll */
body:before{content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;z-index:0;
  pointer-events:none;
  background:
    radial-gradient(48% 52% at 12% 0%,rgba(255,206,0,.22),transparent 70%),
    radial-gradient(42% 46% at 88% 6%,rgba(255,184,0,.14),transparent 72%);
  transform:translateY(var(--mesh,0px));transition:transform .6s var(--ease)}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px 96px;position:relative;z-index:1}
button{font-family:inherit}

/* ---- scroll progress -------------------------------------------------------------------- */
.progress{position:fixed;top:0;left:0;height:2px;width:100%;z-index:60;background:transparent}
.progress i{display:block;height:100%;width:0%;background:var(--grad-y);
  box-shadow:0 0 12px rgba(255,184,0,.7);transition:width .1s linear}

/* ---- floating glass nav ------------------------------------------------------------------ */
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;
  width:min(1160px,calc(100% - 32px));
  display:flex;align-items:center;gap:16px;padding:9px 12px 9px 16px;
  border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 30px rgba(12,15,21,.08);
  transition:padding .3s var(--ease),box-shadow .3s var(--ease),background .3s var(--ease),
    top .3s var(--ease)}
.nav.small{top:8px;padding:5px 10px 5px 12px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,
  0 10px 32px rgba(12,15,21,.13);background:rgba(255,255,255,.86)}
.nav .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;
  letter-spacing:.01em;white-space:nowrap}
.nav .mark{width:22px;height:22px;border-radius:7px;background:var(--grad-y);
  box-shadow:var(--glow);position:relative;flex:none}
.nav .mark:after{content:"";position:absolute;inset:5px;border-radius:50%;
  border:2px solid rgba(12,15,21,.85);
  -webkit-mask:radial-gradient(circle at 78% 22%,transparent 26%,#000 27%);
  mask:radial-gradient(circle at 78% 22%,transparent 26%,#000 27%)}
.nav .mark:before{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;
  border-radius:50%;background:rgba(12,15,21,.85);z-index:1}
.nav .meta{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--ink-2);
  flex-wrap:nowrap;overflow:hidden}
.nav .meta code{font:11px var(--mono);color:var(--ink-3)}
.nav .sp{flex:1}
.nav a.link{color:var(--ink-2);text-decoration:none;font-size:12.5px;font-weight:600;
  padding:5px 11px;border-radius:999px;transition:.2s var(--ease);white-space:nowrap}
.nav a.link:hover{background:var(--y-tint);color:var(--ink)}
.pager{display:flex;gap:5px;align-items:center;background:rgba(12,15,21,.045);
  border-radius:999px;padding:3px}
.pager button{font:inherit;font-size:12.5px;font-weight:600;background:transparent;
  color:var(--ink-2);border:none;border-radius:999px;padding:5px 12px;cursor:pointer;
  transition:.2s var(--ease)}
.pager button:hover:not(:disabled){background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.pager button:disabled{opacity:.3;cursor:default}
.pager .pos{font-size:12px;color:var(--ink-3);padding:0 4px;white-space:nowrap}
.topgap{height:86px}
@media (max-width:980px){ .nav .meta{display:none} }

/* ---- reveal on scroll -------------------------------------------------------------------- */
.rv{opacity:0;transform:translateY(22px);
  transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  body:before{transition:none}
  *{animation-duration:.001ms!important;animation-iteration-count:1!important}
}

/* ---- surfaces ---------------------------------------------------------------------------- */
section{position:relative;background:var(--surface);border-radius:var(--r);margin-top:18px;
  padding:28px 30px;box-shadow:var(--sh-2);border:1px solid var(--rule-2)}
/* gradient hairline border, drawn not faked */
section.case{border:none;padding:29px 31px}
section.case:before{content:"";position:absolute;inset:0;border-radius:var(--r);padding:1px;
  background:linear-gradient(160deg,rgba(255,206,0,.85),rgba(255,206,0,.12) 38%,rgba(231,233,237,.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;pointer-events:none}
h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 18px;font-weight:700;display:flex;align-items:center;gap:10px}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
h2 .cnt{color:var(--ink-2);letter-spacing:0;text-transform:none;font-weight:500;flex:none}
p{margin:0 0 10px}
.dim{color:var(--ink-2)}
.small{font-size:13px}
.k{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-bottom:7px}

/* ---- status rail ------------------------------------------------------------------------- */
.rail{display:flex;gap:11px;align-items:center;font-size:13px;font-weight:600;
  padding:11px 16px;border-radius:999px;margin-bottom:20px;width:fit-content;max-width:100%}
.rail.ended{background:linear-gradient(100deg,var(--y-tint),#FFFDF5);color:#7A5B00;
  box-shadow:inset 0 0 0 1px rgba(255,206,0,.42)}
.rail.live{background:linear-gradient(100deg,var(--bad-bg),#FFF9F8);color:var(--bad);
  box-shadow:inset 0 0 0 1px var(--bad-rule)}
.rail.done{background:linear-gradient(100deg,var(--good-bg),#F8FCFA);color:var(--good);
  box-shadow:inset 0 0 0 1px var(--good-rule)}

h1{font-size:33px;line-height:1.2;margin:0 0 8px;font-weight:660;letter-spacing:-.028em;
  max-width:26ch}
.scope{font-size:13px;color:var(--ink-2);margin-bottom:26px;display:flex;gap:9px;
  align-items:center;flex-wrap:wrap}
.scope b{font-weight:600;color:var(--ink)}

/* ---- hero figures ------------------------------------------------------------------------ */
.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:26px 0 8px}
.hero{position:relative;padding:16px 18px 15px;border-radius:12px;
  background:linear-gradient(170deg,#FFFEFA,#FFFFFF 60%);
  box-shadow:inset 0 0 0 1px var(--rule-2);transition:.35s var(--ease)}
.hero:hover{box-shadow:inset 0 0 0 1px rgba(255,206,0,.55),0 10px 26px rgba(12,15,21,.06);
  transform:translateY(-2px)}
.hero:before{content:"";position:absolute;left:18px;top:0;width:34px;height:3px;
  border-radius:0 0 3px 3px;background:var(--grad-y);opacity:.85}
.hero .v{font-size:40px;line-height:1.04;font-weight:660;letter-spacing:-.035em}
.hero .l{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.42}

/* ---- clickable numerals ------------------------------------------------------------------ */
.n{background:none;border:none;padding:0 1px;margin:0;font:inherit;color:inherit;cursor:pointer;
  position:relative;text-align:left;
  background-image:linear-gradient(var(--y),var(--y));background-size:100% 2px;
  background-position:0 100%;background-repeat:no-repeat;transition:.25s var(--ease)}
.n:hover{background-size:100% 100%;background-image:linear-gradient(var(--y-tint),var(--y-tint));
  border-radius:5px}
.n:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{
  outline:2px solid var(--ink);outline-offset:3px;border-radius:5px}

/* ---- callouts ---------------------------------------------------------------------------- */
.callout{position:relative;border-radius:12px;padding:17px 20px 17px 22px;margin:22px 0;
  background:linear-gradient(120deg,var(--y-tint) 0%,#FFFDF6 55%,#FFFFFF 100%);
  box-shadow:inset 0 0 0 1px rgba(255,206,0,.32)}
.callout:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:3px;background:var(--grad-y)}
.callout .k{color:#7A5B00}
.callout.stop{background:linear-gradient(120deg,var(--bad-bg),#FFFAF9);
  box-shadow:inset 0 0 0 1px var(--bad-rule)}
.callout.stop:before{background:linear-gradient(180deg,#D4573F,var(--bad))}
.callout.stop .k{color:var(--bad)}

/* ---- the five-step tracker --------------------------------------------------------------- */
.track{display:flex;margin:30px 0 10px}
.step{flex:1;position:relative;text-align:center;padding-top:30px}
.step:before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;border-radius:3px;
  background:var(--rule-2)}
.step:first-child:before{left:50%}
.step:last-child:before{right:50%}
.step.done:before{background:var(--grad-y)}
.step.now:before{background:linear-gradient(90deg,var(--y),var(--rule-2))}
.step i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:17px;height:17px;
  border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--rule);display:block;
  transition:.4s var(--ease)}
.step.done i{background:var(--grad-y);box-shadow:var(--glow)}
.step.now i{background:#fff;box-shadow:inset 0 0 0 2px var(--y),0 0 0 5px rgba(255,206,0,.22);
  animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 2px var(--y),0 0 0 4px rgba(255,206,0,.22)}
  50%{box-shadow:inset 0 0 0 2px var(--y),0 0 0 9px rgba(255,206,0,.05)}}
.step .lab{font-size:12.5px;color:var(--ink-3);font-weight:650}
.step.done .lab,.step.now .lab{color:var(--ink)}
.step .sub{font-size:11.5px;color:var(--ink-4);margin-top:3px}

/* ---- ask row ----------------------------------------------------------------------------- */
.askrow{display:grid;grid-template-columns:210px 1fr;gap:28px;margin-top:26px;padding-top:26px;
  border-top:1px solid var(--rule-2)}
.chip{display:inline-block;background:var(--grad-ink);color:#fff;border-radius:999px;
  padding:7px 15px;font-size:12.5px;font-weight:600;margin:0 7px 7px 0;
  box-shadow:0 4px 14px rgba(12,15,21,.16)}

/* ---- evidence ---------------------------------------------------------------------------- */
.ev{padding:20px 0;border-top:1px solid var(--rule-2)}
.ev:first-of-type{border-top:none;padding-top:4px}
.ev .top{display:flex;gap:13px;align-items:baseline;flex-wrap:wrap}
.ev .nm{font-weight:650;min-width:220px}
.bar{height:11px;background:var(--rule-2);border-radius:99px;overflow:hidden;margin:12px 0 9px;
  max-width:440px;box-shadow:inset 0 1px 2px rgba(12,15,21,.05)}
.bar i{display:block;height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,#5A626E,#2B313B);
  transition:width 1.1s var(--ease)}
.bar.bad i{background:linear-gradient(90deg,#D4573F,var(--bad))}
.prov{font-size:12.5px;color:var(--ink-3);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.fid{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;
  border:1.5px solid currentColor}
.fid.measured{background:currentColor}
.fid.derived{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.fid.judged{background:radial-gradient(circle,currentColor 34%,transparent 35%)}
.rmark{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;
  border:2px solid currentColor}
.rmark.live{background:currentColor}
.rmark.ended{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.base{font-size:13.5px;color:var(--ink-2);margin-top:12px;max-width:78ch;padding:12px 16px;
  border-radius:0 10px 10px 0;position:relative;
  background:linear-gradient(100deg,var(--y-tint-2),#fff)}
.base:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;
  background:var(--grad-y)}
.raw{font:12px/1.72 var(--mono);color:var(--ink-2);background:var(--bg);
  box-shadow:inset 0 0 0 1px var(--rule-2);border-radius:10px;padding:14px 16px;margin-top:13px;
  white-space:pre-wrap;overflow-x:auto}

/* ---- disclosure -------------------------------------------------------------------------- */
details{margin-top:15px}
summary{cursor:pointer;font-size:12.5px;color:var(--ink);font-weight:650;list-style:none;
  display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
  background:var(--bg);box-shadow:inset 0 0 0 1px var(--rule);transition:.25s var(--ease)}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--y-tint);box-shadow:inset 0 0 0 1px rgba(255,206,0,.5)}
summary:before{content:"";width:6px;height:6px;border-right:1.6px solid var(--ink-3);
  border-bottom:1.6px solid var(--ink-3);transform:rotate(-45deg);transition:.25s var(--ease)}
details[open]>summary:before{transform:rotate(45deg)}

/* ---- agent trace / tool calls ------------------------------------------------------------ */
.trace{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.tc{border-radius:12px;background:linear-gradient(170deg,#FFFEFA,#fff 55%);
  box-shadow:inset 0 0 0 1px var(--rule-2);overflow:hidden;transition:.3s var(--ease)}
.tc:hover{box-shadow:inset 0 0 0 1px rgba(255,206,0,.45),0 6px 20px rgba(12,15,21,.05)}
.tc .h{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;
  font-size:13.5px;user-select:none}
.tc .idx{width:22px;height:22px;border-radius:7px;background:var(--grad-y);flex:none;
  font:11px/22px var(--mono);text-align:center;font-weight:700;color:var(--ink)}
.tc .nm2{font-weight:650;flex:1;min-width:0}
.tc .st{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--good-bg);color:var(--good);white-space:nowrap}
.tc .ms{font:11px var(--mono);color:var(--ink-4)}
.tc .cv{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.tc.open .cv{max-height:600px}
.tc .body{padding:0 16px 15px 50px;font:11.5px/1.75 var(--mono);color:var(--ink-2);
  white-space:pre-wrap}
.tc .arg{color:var(--ink-4)}


/* ---- the deck: one thing at a time -------------------------------------------------------
 * The case itself - what broke, how big, who acts, and the three buttons - is never behind an
 * interaction. The SUPPORTING layers are: five tiles, each showing a one-line summary so the
 * description is readable without hovering (hover does not exist on touch and is invisible to a
 * keyboard). Exactly one opens at a time, in place rather than as a modal, so a numeral popover
 * inside it is not a modal inside a modal.
 * ------------------------------------------------------------------------------------------- */
/* auto-fit so five tiles or seven both distribute evenly, and scroll-margin so the fixed nav
   never lands on top of the row when a tile is scrolled to */
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;
  margin-top:18px;scroll-margin-top:100px}
.panel{scroll-margin-top:100px}
section{scroll-margin-top:100px}
.dt{position:relative;text-align:left;border:none;cursor:pointer;border-radius:12px;
  padding:15px 16px 14px;background:var(--surface);box-shadow:var(--sh-1),inset 0 0 0 1px var(--rule-2);
  transition:.28s var(--ease);font:inherit;color:inherit;overflow:hidden}
.dt:hover{transform:translateY(-3px);
  box-shadow:0 10px 26px rgba(12,15,21,.08),inset 0 0 0 1px rgba(255,206,0,.5)}
.dt:before{content:"";position:absolute;left:16px;top:0;width:0;height:3px;border-radius:0 0 3px 3px;
  background:var(--grad-y);transition:width .3s var(--ease)}
.dt:hover:before{width:30px}
.dt[aria-selected="true"]{background:linear-gradient(170deg,#FFFDF4,#fff 62%);
  box-shadow:0 10px 30px rgba(12,15,21,.10),inset 0 0 0 1px rgba(255,206,0,.75)}
.dt[aria-selected="true"]:before{width:100%;left:0;border-radius:0}
.dt .tl{font-size:13px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;
  gap:7px}
.dt .tn{font:10.5px var(--mono);color:var(--ink-4);font-weight:700}
.dt .ts{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.45;min-height:32px}
.dt .tb{margin-top:9px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-4)}
.dt[aria-selected="true"] .tb{color:#7A5B00}
.panel{margin-top:14px;animation:panelIn .38s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel section{margin-top:0}
.panel section + section{margin-top:16px}
@media (max-width:1100px){ .dt .ts{min-height:0} }

/* the case card is compressed so the decision fits in the first screen */
section.case{padding:24px 28px}
section.case h1{font-size:28px;margin-bottom:6px}
section.case .heroes{gap:14px;margin:20px 0 4px}
section.case .hero{padding:13px 15px 12px}
section.case .hero .v{font-size:33px}
section.case .track{margin:22px 0 6px}
section.case .callout{margin:18px 0 0}
/* Owner and the ask share a row; the buttons get the full width beneath them. Squeezing three
   decision buttons into a third column crushed the ask to one word per line. */
.gatebar{display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:start;
  margin-top:18px;padding-top:18px;border-top:1px solid var(--rule-2)}
.gatebar .gatewrap{grid-column:1 / -1}
.gatebar .acts{margin-top:6px}
.gatebar .askline{font-size:14.5px;line-height:1.5;max-width:70ch}
@media (max-width:1100px){ .gatebar{grid-template-columns:1fr;gap:14px} }

/* tighter rhythm so the decision lands inside the first screen */
section.case .rail{margin-bottom:14px;padding:9px 15px}
section.case .scope{margin-bottom:18px}
section.case .heroes{margin:16px 0 2px;gap:12px}
section.case .hero{padding:12px 14px 11px}
section.case .hero .v{font-size:31px}
section.case .hero .l{margin-top:4px;font-size:12px}
section.case .track{margin:18px 0 4px}
section.case .step{padding-top:26px}
section.case .callout{margin:14px 0 0;padding:13px 17px 13px 19px}
section.case .callout p{margin-bottom:0}
section.case .btn{padding:13px 24px}
/* ---- actions ----------------------------------------------------------------------------- */
.acts{display:flex;gap:13px;margin-top:26px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:999px;padding:14px 28px;font-size:14.5px;font-weight:650;
  cursor:pointer;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--rule),
  0 1px 2px rgba(12,15,21,.04);transition:.25s var(--ease)}
.btn:hover{box-shadow:inset 0 0 0 1px var(--ink-4),0 6px 18px rgba(12,15,21,.08);
  transform:translateY(-1px)}
.btn.pri{background:var(--grad-ink);color:#fff;box-shadow:0 8px 24px rgba(12,15,21,.22)}
.btn.pri:hover{box-shadow:0 12px 32px rgba(12,15,21,.3);transform:translateY(-2px)}
.btn.warn:hover{background:var(--bad-bg);color:var(--bad);
  box-shadow:inset 0 0 0 1px var(--bad-rule),0 6px 18px rgba(166,47,28,.12)}
.btn.sm{padding:8px 16px;font-size:13px;font-weight:600}
.receipt{border-radius:12px;padding:19px 21px;margin-top:22px}
.receipt.ok{background:linear-gradient(140deg,var(--good-bg),#FAFDFB);
  box-shadow:inset 0 0 0 1px var(--good-rule)}
.receipt.no{background:linear-gradient(140deg,var(--warn-bg),#FFFDF8);
  box-shadow:inset 0 0 0 1px var(--warn-rule)}
.receipt.df{background:linear-gradient(140deg,var(--bg),#fff);
  box-shadow:inset 0 0 0 1px var(--rule)}
.receipt .hd{font-weight:700;font-size:14.5px;margin-bottom:7px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}

/* ---- audit trail ------------------------------------------------------------------------- */
.audit{margin-top:18px;border-top:1px solid rgba(12,15,21,.07);padding-top:16px}
.audit .en{position:relative;padding:14px 0 14px 26px;margin-left:5px}
.audit .en:after{content:"";position:absolute;left:0;top:22px;bottom:-14px;width:2px;
  background:linear-gradient(180deg,var(--rule),transparent)}
.audit .en:last-child:after{display:none}
.audit .en:before{content:"";position:absolute;left:-4px;top:17px;width:11px;height:11px;
  border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--ink-4);z-index:1}
.audit .en.last:before{background:var(--grad-y);box-shadow:var(--glow)}
.audit .eh{font-size:13.5px;font-weight:650;display:flex;gap:10px;align-items:baseline;
  flex-wrap:wrap}
.audit .em{font:11px var(--mono);color:var(--ink-3);margin-top:2px}

/* ---- dismissals / gaps ------------------------------------------------------------------- */
.dis{border-top:1px solid var(--rule-2);padding:18px 0}
.dis:first-of-type{border-top:none;padding-top:2px}
.dis .hd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.grey{background:var(--rule-2);color:var(--ink-2)}
.tag.red{background:linear-gradient(120deg,var(--bad-bg),#FFF7F5);color:var(--bad);
  box-shadow:inset 0 0 0 1px var(--bad-rule)}
.tag.green{background:linear-gradient(120deg,var(--good-bg),#F9FDFB);color:var(--good);
  box-shadow:inset 0 0 0 1px var(--good-rule)}
.tag.amber{background:linear-gradient(120deg,var(--y-tint),#FFFDF6);color:#7A5B00;
  box-shadow:inset 0 0 0 1px rgba(255,206,0,.45)}
.gap{border-top:1px solid var(--rule-2);padding:24px 0}
.gap:first-of-type{border-top:none;padding-top:2px}
.spec{font:12.5px/1.85 var(--mono);color:#E4EAF2;border-radius:12px;padding:17px 19px;
  margin-top:14px;overflow-x:auto;white-space:pre;background:var(--grad-ink);
  box-shadow:0 12px 34px rgba(12,15,21,.2)}
.spec .c{color:var(--y-3)}

/* ---- footer ------------------------------------------------------------------------------ */
.frozen{margin-top:20px;padding:18px 22px;border-radius:var(--r);font-size:13px;
  color:var(--ink-2);display:flex;gap:13px;align-items:flex-start;
  background:linear-gradient(120deg,var(--y-tint-2),#fff);
  box-shadow:inset 0 0 0 1px var(--rule-2)}

/* ---- modal ------------------------------------------------------------------------------- */
.scrim{position:fixed;inset:0;background:rgba(12,15,21,.38);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;
  animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;padding:28px 30px;
  max-height:86vh;overflow:auto;box-shadow:var(--sh-3);animation:rise .32s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 6px;font-size:19px;font-weight:660;letter-spacing:-.02em}
.modal label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin:18px 0 7px}
.modal input,.modal textarea{width:100%;font:14px var(--sans);padding:11px 14px;border:none;
  border-radius:var(--r-ctl);background:var(--bg);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--rule);transition:.2s var(--ease)}
.modal input:focus,.modal textarea:focus{outline:none;
  box-shadow:inset 0 0 0 2px var(--y),0 0 0 4px rgba(255,206,0,.16);background:#fff}
.modal textarea{min-height:86px;resize:vertical}
.reasons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.reasons button{font-size:12.5px;padding:7px 14px;border:none;border-radius:999px;
  background:var(--bg);box-shadow:inset 0 0 0 1px var(--rule);cursor:pointer;color:var(--ink-2);
  transition:.2s var(--ease)}
.reasons button:hover{background:var(--y-tint);color:var(--ink);
  box-shadow:inset 0 0 0 1px rgba(255,206,0,.55)}
.confirm{background:var(--grad-ink);color:#CBD4E0;border-radius:12px;padding:16px 18px;
  margin:20px 0;font:12.5px/1.9 var(--mono);white-space:pre-wrap;
  box-shadow:0 10px 28px rgba(12,15,21,.18)}
.err{background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad-rule);color:var(--bad);
  border-radius:10px;padding:12px 15px;margin-top:15px;font-size:13.5px}
.pop{position:absolute;z-index:200;background:var(--surface);border-radius:14px;
  box-shadow:var(--sh-3);padding:18px 20px;max-width:440px;font-size:13.5px;
  animation:rise .22s var(--ease)}
.pop:before{content:"";position:absolute;inset:0;border-radius:14px;padding:1px;
  background:linear-gradient(160deg,var(--y),rgba(231,233,237,.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;pointer-events:none}
.pop .t{font-weight:700;margin-bottom:9px}
.pop dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-top:13px}
.pop dd{margin:4px 0 0}
.pop .lock{margin-top:15px;padding-top:12px;border-top:1px solid var(--rule-2);font-size:12.5px;
  color:var(--ink-3)}

/* ---- loader ------------------------------------------------------------------------------ */
.boot{min-height:72vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;position:relative;z-index:1}
.orb{position:relative;width:132px;height:132px}
.orb span{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;
  border-top-color:var(--y);border-right-color:rgba(255,184,0,.4);
  animation:spin 2.6s linear infinite}
.orb span:nth-child(2){inset:14px;animation-duration:1.9s;animation-direction:reverse;
  border-top-color:rgba(255,206,0,.55)}
.orb span:nth-child(3){inset:28px;animation-duration:3.3s;border-top-color:rgba(12,15,21,.3)}
.orb:before{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--grad-y);
  filter:blur(13px);opacity:.65;animation:breathe 2.8s var(--ease) infinite}
.orb:after{content:"";position:absolute;inset:50px;border-radius:50%;background:var(--grad-y);
  box-shadow:var(--glow)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:.8;transform:scale(1.12)}}
.bootlines{font:12.5px/2 var(--mono);color:var(--ink-3);text-align:center;height:26px;
  overflow:hidden}
.bootlines b{display:block;color:var(--ink-2);font-weight:500;
  animation:up .5s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .heroes{grid-template-columns:repeat(2,1fr)}
  .askrow{grid-template-columns:1fr;gap:16px}
  h1{font-size:26px}
  .track{flex-wrap:wrap;gap:14px}
  .step{flex:1 1 42%}
  section{padding:22px 20px}
}
</style>
</head>
<body>
<div class="progress"><i id="prog"></i></div>
<nav class="nav" id="nav"></nav>
<div class="topgap"></div>
<div class="wrap" id="app">
  <div class="boot">
    <div class="orb"><span></span><span></span><span></span></div>
    <div class="bootlines"><b id="bootline">Reading the deployment&rsquo;s own logs&hellip;</b></div>
  </div>
</div>
<div id="overlay"></div>
<script>
/* Loop Desk - one screen, one decision.
 *
 * Everything on this page is rendered from loop-report.json. There is not a single day number,
 * tenant name, cohort key, metric name or count written into this file, because the sealed run
 * moves all of them. If the report says something different, the screen says something different.
 */
'use strict';

var R = null, IDX = null, cur = 0;
var $ = function (s, r) { return (r || document).querySelector(s); };
var el = function (t, c, x) { var e = document.createElement(t); if (c) e.className = c;
  if (x != null) e.textContent = x; return e; };
var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s;
  return d.innerHTML; };

/* ---------- formatting -------------------------------------------------------------------- */
function fmtInt(n) { return n == null ? '--' : Number(n).toLocaleString('en-GB'); }
function fmtPct(v, dp) { return v == null ? '--' : (v * 100).toFixed(dp == null ? 1 : dp) + '%'; }
function fmtUsd(v) {
  if (v == null) return '--';
  v = Number(v);
  return '$' + (v >= 100 ? Math.round(v).toLocaleString('en-GB') : v.toFixed(2));
}
/* Coverage below 1.0 means the figure describes part of the traffic, so trailing decimals are
 * false precision. Round to what the coverage can actually support. */
function sigFor(coverage) { return (coverage != null && coverage < 0.95) ? 2 : 4; }

/* ---------- indexing ---------------------------------------------------------------------- */
function buildIndex(rep) {
  var byFinding = {}, byDiag = {}, byPres = {}, presById = {}, diagById = {};
  (rep.diagnoses || []).forEach(function (d) { byFinding[d.finding_id] = d; diagById[d.id] = d; });
  (rep.prescriptions || []).forEach(function (p) { byDiag[p.diagnosis_id] = p; presById[p.id] = p; });
  (rep.verifications || []).forEach(function (v) {
    (byPres[v.prescription_id] = byPres[v.prescription_id] || []).push(v);
  });

  /* Per-tenant coverage, read out of metrics[]. Never blended: a single figure across tenants
   * describes neither deployment, and the report states them separately for that reason. */
  var cov = {};
  (rep.metrics || []).forEach(function (m) {
    var c = m.coverage || {};
    if (c.value == null) return;
    (rep.findings || []).forEach(function (f) {
      var slug = String(f.tenant || '').replace(/\W+/g, '_');
      if (slug && m.id && m.id.indexOf(slug) >= 0 && cov[f.tenant] == null) {
        cov[f.tenant] = { value: c.value, basis: c.basis, excluded: c.excluded || [] };
      }
    });
  });
  var cal = null;
  (rep.metrics || []).forEach(function (m) { if (m.calibration && cal == null) cal = m.calibration; });

  return { byFinding: byFinding, byDiag: byDiag, byPres: byPres, presById: presById,
           diagById: diagById, cov: cov, cal: cal,
           regs: (rep.findings || []).filter(function (f) { return f.is_regression; }),
           dis: (rep.findings || []).filter(function (f) { return !f.is_regression; }) };
}

/* Resolve the honesty envelope for one number on one finding.
 *
 * Coverage is looked up for THIS series, not borrowed from a neighbouring one. The pipeline
 * measures it per tenant: by full series name for session fields (s.cost_usd, s.quality_score@v1)
 * and by step type for step series (tool_call, kb_lookup). Falling back to a tenant-wide figure
 * would put the tool_call hole's 72% next to knowledge-base numbers that actually cover 100%.
 */
function envelope(f, meta) {
  meta = meta || {};
  var name = meta.name || '';
  var measured = (R.coverage_measured || {})[f.tenant] || {};
  var cov = measured[name];
  if (cov == null && name.indexOf('.') > 0 && !/^s\./.test(name)) cov = measured[name.split('.')[0]];
  var out = { fidelity: meta.fidelity || 'derived', definition: meta.definition || '',
              plain: meta.plain || '' };
  var tenantCov = IDX.cov[f.tenant];
  if (cov != null) {
    out.coverage = cov;
    out.coverageBasis = cov >= 1
      ? 'Measured: every conversation on this tenant can produce this number. Nothing is excluded.'
      : 'Measured: the share of this tenant\u2019s conversations that can produce this number at '
        + 'all. The rest cannot \u2014 that is not a sample, it is a structural blind spot.';
    out.excluded = cov < 1 && tenantCov ? (tenantCov.excluded || []) : [];
  } else if (meta.basis === 'step') {
    out.coverage = tenantCov ? tenantCov.value : null;
    out.coverageBasis = tenantCov ? tenantCov.basis
      : 'Coverage for this series is not stated in the report.';
    out.excluded = tenantCov ? tenantCov.excluded : [];
  } else {
    out.coverage = 1.0;
    out.coverageBasis = 'Every conversation can produce this number; nothing is excluded.';
    out.excluded = [];
  }
  out.calibration = out.fidelity === 'judged' ? IDX.cal : null;
  return out;
}

/* ---------- the numeral popover ----------------------------------------------------------- */
/* One interaction, applied to every numeral on the page. This is the literal rubric clause:
 * "does every number carry its definition". */
function num(text, info, cls) {
  var b = el('button', 'n' + (cls ? ' ' + cls : ''), text);
  b.type = 'button';
  b.setAttribute('aria-haspopup', 'dialog');
  b.addEventListener('click', function (e) { e.stopPropagation(); showPop(b, info); });
  return b;
}

function showPop(anchor, info) {
  closePop();
  var p = el('div', 'pop');
  p.setAttribute('role', 'dialog');
  p.appendChild(el('div', 't', info.title || 'This number'));
  var dl = el('dl');
  function row(k, v) {
    if (v == null || v === '') return;
    dl.appendChild(el('dt', null, k));
    dl.appendChild(el('dd', null, v));
  }
  row('What it is', info.definition);
  var FID = { measured: 'Measured - counted directly in the logs. We know this happened.',
              derived: 'Derived - calculated from things we counted. No opinion involved.',
              judged: 'Judged - a model read the conversation and formed an opinion.' };
  row('How we know it', FID[info.fidelity] || info.fidelity);
  if (info.coverage != null) {
    row('Coverage', fmtPct(info.coverage, 0) + ' of this deployment’s conversations. '
        + (info.coverageBasis || ''));
    if (info.coverage < 1 && (info.excluded || []).length) {
      row('Excluded', info.excluded.join('; ')
          + ' — this is not a sample, it is a structural blind spot: that traffic cannot '
          + 'produce this number at all.');
    }
  }
  if (info.calibration) {
    var ag = info.calibration.agreement;
    if (ag >= 0.995) {
      row('Calibration', '⚠ Suspiciously perfect (' + ag.toFixed(4) + ') — investigate. '
          + 'Human reviewers disagree with each other, so perfect agreement means something is '
          + 'wrong, not that the judge is excellent.');
    } else {
      row('Calibration', 'Agrees with human reviewers ' + fmtPct(ag, 0) + ' of the time (n='
          + info.calibration.n + (info.calibration.judge_version ? ', judge '
          + info.calibration.judge_version : '') + '). '
          + (info.calibration.basis || '')
          + ' Human labellers disagree with each other about 7.5% of the time, so agreement of '
          + '1.00 would be a bug, not a good judge.');
    }
  } else if (info.fidelity === 'judged') {
    row('Calibration', 'Not published. No human labels exist for this question in the kit, so '
        + 'agreement cannot be computed and none is claimed.');
  } else {
    row('Calibration', 'Not applicable — this is not a judged number.');
  }
  row('How it was computed', info.derivation);
  row('Rounding', info.rounding);
  p.appendChild(dl);
  var lk = el('div', 'lock', '🔒 Definition frozen — v1.0. This system proposes '
      + 'changes to the agent, never to the yardstick.');
  p.appendChild(lk);

  document.body.appendChild(p);
  var r = anchor.getBoundingClientRect();
  var top = r.bottom + window.scrollY + 7;
  var left = Math.min(r.left + window.scrollX, window.scrollX + window.innerWidth - p.offsetWidth - 16);
  if (top + p.offsetHeight > window.scrollY + window.innerHeight) {
    top = Math.max(window.scrollY + 8, r.top + window.scrollY - p.offsetHeight - 7);
  }
  p.style.top = top + 'px';
  p.style.left = Math.max(8, left) + 'px';
  setTimeout(function () { document.addEventListener('click', closePop, { once: true }); }, 0);
}
function closePop() { var p = $('.pop'); if (p) p.remove(); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); closeModal(); } });

/* ---------- evidence-line parser ---------------------------------------------------------- */
/* The scanner emits evidence as prose in a stable shape. Parsing it back into a value, a
 * baseline and a direction is what lets the screen draw a comparison instead of printing a log
 * line at an operator. Anything that does not match is shown as-is, never dropped. */
var EV_RE = /^(\S+) on (.+?), days (\d+)-(\d+): ([\d.]+) -> ([\d.]+) \(([+-]?[\d.]+)%, z=([\d.]+)(?:, baseline: (.+?))?\)\s*$/;
function parseEvidence(s) {
  var m = EV_RE.exec(s);
  if (!m) return { raw: s };
  return { series: m[1], where: m[2], from_day: +m[3], to_day: +m[4],
           base: parseFloat(m[5]), obs: parseFloat(m[6]), pct: parseFloat(m[7]),
           z: parseFloat(m[8]), basis: m[9] || null, raw: s };
}


/* ---------- scroll behaviour ---------------------------------------------------------------
 * Four effects, all cheap and all switched off under prefers-reduced-motion: a progress bar, a
 * reveal-on-enter for each section, count-up on the hero figures, and a mesh that drifts with
 * the page. The decision receipt is deliberately excluded from all of it - motion on the moment
 * someone signs off a production change reads as unserious.
 * ------------------------------------------------------------------------------------------- */
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var FX = (function () {
  var raf = 0;
  function onScroll() {
    if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = 0;
      var y = window.scrollY || 0;
      var h = Math.max(1, document.body.scrollHeight - window.innerHeight);
      var bar = document.getElementById('prog');
      if (bar) bar.style.width = Math.min(100, (y / h) * 100) + '%';
      var nav = document.getElementById('nav');
      if (nav) nav.classList.toggle('small', y > 40);
      if (!REDUCED) document.body.style.setProperty('--mesh', (-y * 0.16) + 'px');
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      io.unobserve(e.target);
      countUp(e.target);
      growBars(e.target);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: .08 }) : null;

  /* Bars animate to their real width the first time they are seen. The width is the data; the
   * transition is only how it arrives. */
  function growBars(root) {
    [].forEach.call(root.querySelectorAll('.bar i[data-w]'), function (b) {
      requestAnimationFrame(function () { b.style.width = b.getAttribute('data-w'); });
    });
  }

  /* Count-up reads the final text, never a computed one, so what lands is exactly what the
   * report says - including the separators and the units. */
  function countUp(root) {
    if (REDUCED) return;
    [].forEach.call(root.querySelectorAll('[data-count]'), function (n) {
      var final = n.textContent;
      var m = final.match(/-?[\d,.]+/);
      if (!m) return;
      var target = parseFloat(m[0].replace(/,/g, ''));
      if (!isFinite(target) || target === 0) return;
      var dp = (m[0].split('.')[1] || '').length;
      var t0 = performance.now(), dur = 850;
      (function tick(now) {
        var k = Math.min(1, (now - t0) / dur);
        var e = 1 - Math.pow(1 - k, 3);
        var v = target * e;
        n.textContent = final.replace(m[0], dp
          ? v.toFixed(dp)
          : Math.round(v).toLocaleString('en-GB'));
        if (k < 1) requestAnimationFrame(tick); else n.textContent = final;
      })(t0);
    });
  }

  return {
    observe: function (root) {
      [].forEach.call((root || document).querySelectorAll('.rv'), function (n) {
        if (io) io.observe(n); else { n.classList.add('in'); countUp(n); growBars(n); }
      });
      onScroll();
    }
  };
})();

/* ---------- the boot sequence --------------------------------------------------------------- */
var BOOT_LINES = [
  'Reading the deployment\u2019s own logs\u2026',
  'Counting every execution step\u2026',
  'Testing every metric against every slice of traffic\u2026',
  'Ruling out the things that only look like problems\u2026',
  'Checking what cannot be measured at all\u2026'
];
function bootTicker() {
  var i = 0, node = document.getElementById('bootline');
  if (!node) return function () {};
  var t = setInterval(function () {
    i = (i + 1) % BOOT_LINES.length;
    var n = document.getElementById('bootline');
    if (!n) return clearInterval(t);
    n.style.animation = 'none';
    n.textContent = BOOT_LINES[i];
    void n.offsetWidth;
    n.style.animation = '';
  }, 1400);
  return function () { clearInterval(t); };
}
var stopBoot = bootTicker();

/* ---------- system bar -------------------------------------------------------------------- */
function renderSysbar() {
  var bar = $('#nav');
  bar.innerHTML = '';
  var f = IDX.regs[cur];
  var brand = el('div', 'brand');
  brand.appendChild(el('span', 'mark'));
  brand.appendChild(el('span', null, 'Loop Desk'));
  bar.appendChild(brand);

  var a = el('a', 'link', 'The brief');
  a.href = '/brief';
  bar.appendChild(a);

  var meta = el('div', 'meta');
  var decided = (R.prescriptions || []).filter(function (p) {
    return p.approval && p.approval.verdict; }).length;
  if (f) meta.appendChild(el('span', null, f.tenant));
  meta.appendChild(el('span', null, IDX.regs.length + ' to decide \u00b7 ' + IDX.dis.length
    + ' dismissed \u00b7 ' + (R.gaps || []).length + ' refused \u00b7 ' + decided + ' signed off'));
  if (R.report_build) {
    var c = el('code', null, String(R.report_build).replace('sha256:', '').slice(0, 10));
    c.title = R.report_build;
    meta.appendChild(c);
  }
  bar.appendChild(meta);
  bar.appendChild(el('span', 'sp'));

  var pg = el('div', 'pager');
  var prev = el('button', null, '\u2039'), next = el('button', null, '\u203a');
  prev.type = next.type = 'button';
  prev.title = 'previous case'; next.title = 'next case';
  prev.disabled = cur <= 0;
  next.disabled = cur >= IDX.regs.length - 1;
  prev.onclick = function () { cur--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  next.onclick = function () { cur++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  pg.appendChild(prev);
  pg.appendChild(el('span', 'pos', (IDX.regs.length ? cur + 1 : 0) + ' / ' + IDX.regs.length));
  pg.appendChild(next);
  bar.appendChild(pg);
}

/* ---------- the finding ------------------------------------------------------------------- */
function renderFinding(f) {
  var s = el('section', 'case');
  var d = IDX.byFinding[f.id] || {};
  var p = IDX.byDiag[d.id] || null;
  var imp = f.impact || {};
  var approved = p && p.approval && p.approval.verdict;

  var railCls = approved ? 'done' : (/^Still running/i.test(f.status_plain || '') ? 'live' : 'ended');
  if (railCls === 'done') s.classList.add('done');
  else if (approved) s.classList.add('no');
  var rail = el('div', 'rail ' + railCls);
  if (approved) rail.appendChild(document.createTextNode('\u2713'));
  else rail.appendChild(el('i', 'rmark ' + railCls));
  rail.appendChild(el('span', null, f.status_plain || ''));
  s.appendChild(rail);

  s.appendChild(el('h1', null, f.title_plain || fallbackTitle(f, d)));
  var scope = f.tenant + (f.cohort_label ? ' · ' + f.cohort_label : '');
  if (f.scope_plain) scope += ' · ' + f.scope_plain;
  s.appendChild(el('div', 'scope', scope));

  /* Exactly four hero numbers. Four can be absorbed at a glance; seven cannot. */
  var heroes = el('div', 'heroes');
  function hero(valNode, label) {
    var h = el('div', 'hero'), v = el('div', 'v');
    valNode.setAttribute('data-count', '1');
    v.appendChild(valNode);
    h.appendChild(v);
    h.appendChild(el('div', 'l', label));
    heroes.appendChild(h);
  }
  var covT = IDX.cov[f.tenant];
  hero(num(fmtInt(imp.conversations_affected), {
    title: 'Conversations affected', definition: 'Conversations in this cohort during the window.',
    fidelity: 'measured', coverage: 1.0,
    coverageBasis: 'Every session is counted; nothing is excluded from this one.',
    derivation: imp.derivation }), 'conversations affected');

  hero(num(fmtPct(imp.share_of_traffic, 1), {
    title: 'Share of traffic', definition: 'This cohort as a share of the tenant’s '
      + 'conversations in the same window.',
    fidelity: 'derived', coverage: 1.0,
    coverageBasis: 'Both numerator and denominator are counted on every session.',
    derivation: imp.derivation }), 'of ' + f.tenant + ' traffic');

  var dn = imp.downstream || {};
  if (imp.impact_type === 'spend_and_time') {
    hero(num(fmtUsd(imp.cost_usd), {
      title: 'Spend on these conversations', definition: 'Model spend summed over the cohort '
        + 'in the window. Only agents that emit llm_call steps record cost at all.',
      fidelity: 'measured', coverage: covT ? covT.value : null,
      coverageBasis: covT ? covT.basis : '', excluded: covT ? covT.excluded : [],
      derivation: imp.derivation,
      rounding: 'Shown to the precision its coverage supports.' }), 'spent on them');
  } else {
    hero(num(fmtInt(dn.would_have_resolved_at_baseline), {
      title: 'Conversations that should have resolved', definition: 'Conversations that would have '
        + 'resolved at the baseline rate and did not. Baseline × conversations, minus those '
        + 'that actually resolved.',
      fidelity: 'derived', coverage: 1.0,
      coverageBasis: 'Resolution is recorded on every session.',
      derivation: imp.derivation,
      rounding: 'A count derived from two rates, so it is approximate; the derivation shows both.'
    }), 'did not resolve that should have');
  }

  hero(num(fmtInt(imp.days_running) + ' days', {
    title: 'Days running', definition: 'Days from onset to the last day the fault was observed. '
      + 'The scan window opens two days earlier so the onset itself is inside it.',
    fidelity: 'derived', coverage: 1.0,
    coverageBasis: 'Derived from the day index on every session.',
    derivation: 'Window days ' + (f.window || {}).from_day + '-' + (f.window || {}).to_day
      + '; duration measured from onset.' }), 'before anyone could act');
  s.appendChild(heroes);

  if (imp.outcome_note) {
    var on = el('div', 'callout');
    on.appendChild(el('div', 'k', '⚠  Read this before the numbers above'));
    on.appendChild(el('p', null, imp.outcome_note));
    s.appendChild(on);
  }

  s.appendChild(renderTrack(f, d, p, approved));

  if (f.if_nothing_changes) {
    var c = el('div', 'callout');
    c.appendChild(el('div', 'k', '⚑  If nobody acts'));
    c.appendChild(el('p', null, f.if_nothing_changes));
    s.appendChild(c);
  }

  var AUD = { agent_builder: 'Agent Builder', business_owner: 'Business Owner',
              platform_owner: 'Platform Team' };
  /* Owner, the ask, and the three buttons on one line at the foot of the case card. The
   * decision was 3,161px down the page - three and a half screens - which is a long way to
   * scroll to reach the only control that matters. */
  var row = el('div', 'gatebar');
  var left = el('div');
  left.appendChild(el('div', 'k', 'Who has to act'));
  (f.audience || []).forEach(function (a) {
    left.appendChild(el('span', 'chip', AUD[a] || a));
  });
  row.appendChild(left);
  var mid = el('div');
  mid.appendChild(el('div', 'k', 'Decision asked of you'));
  mid.appendChild(el('div', 'askline', p && p.decision ? p.decision.asking_approval_for
    : 'No fix is proposed for this finding. It is reported for a human to route.'));
  row.appendChild(mid);
  row.appendChild(p ? renderGate(f, p) : el('div'));
  s.appendChild(row);
  return s;
}

/* A report emitted before the language layer carries no title_plain. Compose one from the cause
 * class and the cohort rather than showing a finding id to a person. */
var FALLBACK_TITLE = {
  'kb.gap': 'Customers asking about {c} are not getting a useful answer.',
  'tool.contract_break': 'A tool behind {c} reports success while returning nothing.',
  'tool.outage': 'A tool behind {c} is failing outright.',
  'prompt.regression': 'Conversations in {c} got longer and more expensive without getting better.',
  'model.change': 'A model change altered how {c} behaves.',
  'routing.error': 'Conversations in {c} are being sent to the wrong place.',
  'traffic_mix': 'The mix of questions changed - the totals moved, the service did not.',
  'load': 'Traffic ran far above normal and the platform slowed down, then recovered.',
  'judge_change': 'The quality-scoring rubric changed version - the scores moved, the agents did not.'
};
function fallbackCohort(f) {
  var c = f.cohort || {}, k = Object.keys(c)[0];
  if (!k) return 'all ' + f.tenant + ' traffic';
  var v = String(c[k]);
  if (k === 'intent') return v.replace(/_(info|enquiry|query)$/, '').replace(/_/g, ' ')
    .replace(/\b\w/g, function (m) { return m.toUpperCase(); }) + ' enquiries';
  if (k === 'tool' || k === 'tool_name') return 'the ' + v + ' tool';
  if (k === 'agent_id') return 'the ' + v + ' agent';
  return v.replace(/_/g, ' ');
}
function fallbackTitle(f, d) {
  var t = FALLBACK_TITLE[(d || {}).cause_class];
  var c = fallbackCohort(f);
  if (t) return t.replace('{c}', c);
  return f.is_regression ? 'Service quality dropped in ' + c + '.'
                         : c.charAt(0).toUpperCase() + c.slice(1) + ' looked like a problem and is not one.';
}


/* The loop's five stages, named the way an operator would say them. Detection, Diagnosis,
 * Prescription and Verification are this architecture's words, and putting them in front of
 * someone who runs a bank's support line is the same mistake as opening a demo on a diagram. */
function renderTrack(f, d, p, approved) {
  var vs = p ? (IDX.byPres[p.id] || []).filter(function (v) { return !v.is_alternative; }) : [];
  var steps = [
    { lab: 'Found it', sub: f.status_plain ? 'days ' + f.window.from_day + '\u2013' + f.window.to_day : '',
      done: true },
    { lab: 'Explained it',
      sub: d && d.attributed_change ? 'day ' + d.attributed_change.day + ' \u00b7 ' + d.attributed_change.kind + ' change'
           : (d ? 'no change attributed' : ''), done: !!d },
    { lab: 'Proposed a fix', sub: p ? p.change_type : 'none proposed', done: !!p },
    { lab: 'Tested it',
      sub: vs.length ? (vs[0].verdict === 'improved' ? 'improved on replay' : vs[0].verdict.replace('_', ' '))
           : 'not verified', done: !!vs.length },
    { lab: 'Your call', sub: approved ? 'recorded' : 'waiting on you', done: !!approved }
  ];
  var t = el('div', 'track');
  var firstOpen = steps.findIndex(function (x) { return !x.done; });
  steps.forEach(function (x, i) {
    var cls = x.done ? 'step done' : (i === firstOpen ? 'step now' : 'step');
    var e = el('div', cls);
    e.appendChild(el('i'));
    e.appendChild(el('div', 'lab', x.lab));
    if (x.sub) e.appendChild(el('div', 'sub', x.sub));
    t.appendChild(e);
  });
  return t;
}

/* ---------- WHAT WE MEASURED -------------------------------------------------------------- */
function renderMeasured(f) {
  var s = el('section');
  s.appendChild(el('h2', null, 'What we measured'));
  var rows = (f.evidence || []).map(parseEvidence);
  var numeric = rows.filter(function (r) { return r.series; });
  var notes = rows.filter(function (r) { return !r.series; });

  if (!numeric.length && !notes.length) s.appendChild(el('p', 'dim', 'No evidence rows recorded.'));

  /* One claim per row: name, value, bar, baseline, provenance. Never a table of twelve metrics. */
  numeric.slice(0, 4).forEach(function (r, i) {
    var meta = (i === 0 && f.metric_plain && f.metric_plain.name === r.series)
      ? f.metric_plain : guessMeta(r.series);
    var env = envelope(f, meta);
    var d = el('div', 'ev');
    var top = el('div', 'top');
    top.appendChild(el('div', 'nm', meta.plain || r.series));
    var dp = sigFor(env.coverage);
    var shown = fmtMeasure(r.obs, meta, env.coverage),
        baseShown = fmtMeasure(r.base, meta, env.coverage);
    top.appendChild(num(shown, {
      title: meta.plain || r.series, definition: meta.definition, fidelity: env.fidelity,
      coverage: env.coverage, coverageBasis: env.coverageBasis, excluded: env.excluded,
      calibration: env.calibration,
      derivation: r.raw,
      rounding: env.coverage != null && env.coverage < 0.95
        ? 'Shown to ' + dp + ' decimal places because coverage is '
          + fmtPct(env.coverage, 0) + ' — more would be false precision.'
        : null }));
    top.appendChild(el('span', 'dim small', 'vs ' + baseShown + ' baseline · '
      + (r.pct > 0 ? '+' : '') + r.pct + '% · z=' + r.z));
    d.appendChild(top);

    var worse = meta.higher_is_better === true ? r.obs < r.base
      : meta.higher_is_better === false ? r.obs > r.base : false;
    var mx = Math.max(Math.abs(r.obs), Math.abs(r.base)) || 1;
    var bar = el('div', 'bar' + (worse ? ' bad' : ''));
    var fill = el('i');
    /* the width is the data; the transition is only how it arrives */
    fill.setAttribute('data-w', Math.min(100, Math.abs(r.obs) / mx * 100) + '%');
    bar.appendChild(fill);
    d.appendChild(bar);

    var CH = { measured: 'Measured', derived: 'Derived', judged: 'Judged' };
    var prov = el('div', 'prov');
    var mark = el('span');
    mark.style.display = 'inline-flex';
    mark.style.gap = '6px';
    mark.style.alignItems = 'center';
    mark.appendChild(el('i', 'fid ' + env.fidelity));
    mark.appendChild(document.createTextNode(CH[env.fidelity] || env.fidelity));
    prov.appendChild(mark);
    prov.appendChild(el('span', null, '·'));
    prov.appendChild(el('span', null, 'covers ' + fmtPct(env.coverage, 0) + ' of ' + f.tenant));
    if (r.where) { prov.appendChild(el('span', null, '·')); prov.appendChild(el('span', null, r.where)); }
    d.appendChild(prov);

    if (i === 0 && f.baseline && f.baseline.justification) {
      var b = el('div', 'base');
      b.appendChild(el('strong', null, 'Baseline: '
        + (f.baseline.type === 'peer_traffic' ? 'peer traffic. ' : 'its own history. ')));
      b.appendChild(document.createTextNode(f.baseline.justification));
      d.appendChild(b);
    }
    s.appendChild(d);
  });

  notes.forEach(function (r) { s.appendChild(el('p', 'small dim', '• ' + r.raw)); });

  /* Disclosure reveals HOW we know, never WHAT we claim. */
  var det = el('details');
  det.appendChild(el('summary', null, 'Show the full working'));
  if ((f.impact || {}).derivation) {
    det.appendChild(el('div', 'k', 'Derivation'));
    det.appendChild(el('div', 'raw', f.impact.derivation));
  }
  if (rows.length > 4) {
    det.appendChild(el('div', 'k', 'Every series that moved'));
    det.appendChild(el('div', 'raw', (f.evidence || []).join('\n')));
  }
  s.appendChild(det);

  var refused = [];
  (R.metrics || []).forEach(function (m) {
    ((m.plan || {}).refused_breakdowns || []).forEach(function (x) {
      if (refused.indexOf(x) < 0) refused.push(x);
    });
  });
  if (refused.length) {
    var line = el('p', 'small dim');
    line.style.marginTop = '12px';
    line.appendChild(document.createTextNode('Breakdowns we refused rather than truncated: '
      + refused.join('; ') + '.'));
    s.appendChild(line);
  }
  return s;
}

function fmtNum(v, dp) {
  if (v == null) return '--';
  if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString('en-GB');
  var t = Number(v).toFixed(dp);
  return t.replace(/\.?0+$/, '') || '0';
}

/* A rate reads as a percentage to a person and as a decimal to a machine. The operator gets the
 * percentage; the exact stored value is in the popover. Money, milliseconds, scores and counts
 * keep their own units - "0.25" is a match score, not 25% of anything. */
function fmtMeasure(v, meta, coverage) {
  if (v == null) return '--';
  var u = (meta || {}).unit;
  if (u === 'rate') return fmtPct(v, (coverage != null && coverage < 0.95) ? 1 : (Math.abs(v) < 0.1 ? 1 : 0));
  if (u === 'usd') return fmtUsd(v);
  if (u === 'ms') return Math.round(v).toLocaleString('en-GB') + ' ms';
  return fmtNum(v, sigFor(coverage));
}

/* Fallback metadata for a series the report did not annotate. Mirrors nexus/language.py so the
 * screen degrades to a sentence rather than a raw key. */
var SESSION_META = {
  's.resolved': ['Resolution rate', 'measured', true, 'rate',
    'Share of conversations that ended resolved.'],
  's.milestones_complete': ['Journey completion rate', 'measured', true, 'rate',
    'Share of conversations that reached every milestone their intent defines.'],
  's.milestone_ratio': ['Journey progress', 'derived', true, 'rate',
    'Average share of an intent\u2019s milestones reached before the conversation ended.'],
  's.handoff_unplanned': ['Unplanned handoffs', 'measured', false, 'rate',
    'Share of conversations handed to a human the journey never intended to involve.'],
  's.abandoned': ['Abandonment rate', 'measured', false, 'rate',
    'Share of conversations the customer left without resolving. How many gave up is measured; '
    + 'why they gave up is not \u2014 see the refused questions.'],
  's.turns': ['Exchanges per conversation', 'measured', false, 'count',
    'Back-and-forth turns before the conversation ended.'],
  's.duration_s': ['Conversation length', 'measured', false, 'count',
    'Wall-clock seconds from first to last turn.'],
  's.cost_usd': ['Cost per conversation', 'measured', false, 'usd',
    'Model spend per conversation, summed over its llm_call steps.'],
  's.tool_error_any': ['Conversations hitting a tool error', 'derived', false, 'rate',
    'Share of conversations with at least one tool call that did not return ok. Declared '
    + 'failures only \u2014 a tool returning 200 with an empty body counts as a success here.'],
  's.guardrail_any': ['Conversations hitting a guardrail', 'measured', false, 'rate',
    'Share of conversations where at least one guardrail step fired.']
};

function guessMeta(series) {
  if (SESSION_META[series]) {
    var x = SESSION_META[series];
    return { name: series, plain: x[0], fidelity: x[1], higher_is_better: x[2], unit: x[3],
             definition: x[4], basis: series === 's.cost_usd' ? 'step' : 'session' };
  }
  var NOUN = { tool_call: 'tool call', kb_lookup: 'knowledge-base lookup', llm_call: 'model call',
               guardrail: 'guardrail', handoff: 'handoff', turn: 'turn' };
  var SUF = { fail: ['failure rate', 'measured', false, 'rate'],
              empty: ['empty-response rate', 'derived', false, 'rate'],
              miss: ['miss rate', 'measured', false, 'rate'],
              retry: ['retry rate', 'measured', false, 'rate'],
              duration_ms: ['response time', 'measured', false, 'ms'],
              timeout: ['timeout rate', 'measured', false, 'rate'],
              blocked: ['blocked rate', 'measured', false, 'rate'],
              top_score: ['best match score', 'measured', true, 'score'],
              tokens: ['tokens used', 'measured', false, 'count'] };
  if (series.indexOf('share:') === 0) {
    return { name: series, plain: 'Share of traffic by ' + series.split(':')[1],
             fidelity: 'derived', basis: 'session', higher_is_better: null, unit: 'rate',
             definition: 'What proportion of traffic each value accounts for. A change here moves '
               + 'every aggregate without anything getting better or worse.' };
  }
  if (series.indexOf('s.quality_score') === 0) {
    return { name: series, plain: 'Judged quality', fidelity: 'judged', basis: 'session',
             higher_is_better: true, unit: 'score',
             definition: 'A model’s 1-5 score for the conversation, comparable only within '
               + 'one rubric version.' };
  }
  var parts = series.split('.');
  if (parts.length === 2 && SUF[parts[1]]) {
    var n = NOUN[parts[0]] || parts[0].replace(/_/g, ' '), t = SUF[parts[1]];
    return { plain: n.charAt(0).toUpperCase() + n.slice(1) + ' ' + t[0], fidelity: t[1],
             basis: 'step', higher_is_better: t[2],
             definition: 'Measured on ' + n + ' steps in the agent’s execution log.' };
  }
  return { name: series, plain: series.replace(/^s\./, '').replace(/[_.]/g, ' '),
           fidelity: 'derived', basis: 'session', higher_is_better: null, unit: 'count',
           definition: 'Computed from the deployment’s own logs.' };
}

/* ---------- WHY IT HAPPENED --------------------------------------------------------------- */
function renderWhy(f) {
  var d = IDX.byFinding[f.id];
  if (!d) return null;
  var s = el('section');
  s.appendChild(el('h2', null, 'Why it happened'));
  var att = d.attributed_change;
  if (att) {
    var line = el('p');
    line.style.fontSize = '16px';
    line.appendChild(el('strong', null, 'Day ' + att.day + ' · ' + att.kind + ' change'));
    s.appendChild(line);
    var detail = (d.evidence || []).filter(function (x) { return /attributed via/i.test(x); })[0];
    if (detail) s.appendChild(el('p', 'small dim', detail));
  } else {
    s.appendChild(el('p', null, 'No configuration change lines up with this window.'));
  }
  if (d.attribution_confidence_plain) {
    var tag = el('span', 'tag amber');
    tag.style.display = 'inline-flex';
    tag.style.gap = '6px';
    tag.style.alignItems = 'center';
    tag.appendChild(el('i', 'fid derived'));
    tag.appendChild(document.createTextNode(d.attribution_confidence_plain));

  }
  if (d.attribution_plain) {

    ap.style.maxWidth = '80ch';
    ap.textContent = d.attribution_plain;
    s.appendChild(ap);
  }
