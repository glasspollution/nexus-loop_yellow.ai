<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%2316191d%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%274%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
<style>
/* ============================================================================================
   Loop Desk - design system
   Brand: Yellow.ai. Bright signature yellow, near-black, generous whitespace, rounded cards.
   Yellow is a FILL behind near-black text, never text on white and never a primary action -
   a yellow approve button reads as a warning and fails contrast on a decision surface.
   ============================================================================================ */
:root{
  --y:        #FFCE00;          /* PLACEHOLDER: replace with the exact Yellow.ai brand hex */
  --y-dk:     #E0B400;
  --y-tint:   #FFF8DB;
  --y-tint-2: #FFFDF2;

  --ink:   #10131A;  --ink-2: #4A5158;  --ink-3: #767E88;  --ink-4:#9AA2AB;
  --bg:    #FAFAF7;  --surface:#FFFFFF; --rule:  #E6E8EC;  --rule-2:#F1F3F6;
  --good:  #1F6B43;  --good-bg:#F0F8F3; --good-rule:#CFE6DA;
  --warn:  #8A5A09;  --warn-bg:#FDF7EA; --warn-rule:#F0E2BF;
  --bad:   #A8321F;  --bad-bg: #FDF3F1; --bad-rule: #F2D7D0;

  --sh-1: 0 1px 2px rgba(16,19,26,.05);
  --sh-2: 0 10px 34px rgba(16,19,26,.10);
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-card: 12px; --r-ctl: 8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.58 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 72px}
button{font-family:inherit}
a{color:inherit}

/* ---- system bar ------------------------------------------------------------------------- */
.sysbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#E9ECF1;font-size:12.5px}
.sysbar .in{max-width:1180px;margin:0 auto;padding:9px 24px;display:flex;gap:18px;
  align-items:center;flex-wrap:wrap}
.sysbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;color:#fff;
  letter-spacing:.02em}
.sysbar .dot{width:9px;height:9px;border-radius:2px;background:var(--y);display:inline-block}
.sysbar .sp{flex:1}
.sysbar code{font:11.5px var(--mono);color:#93A6C0}
.sysbar a.home{color:#C9D2DD;text-decoration:none;border-bottom:1px solid transparent}
.sysbar a.home:hover{color:#fff;border-bottom-color:var(--y)}
.nav{display:flex;gap:6px;align-items:center}
.nav button{font:inherit;background:#252A32;color:#E9ECF1;border:1px solid #363C45;
  border-radius:6px;padding:4px 11px;cursor:pointer}
.nav button:hover:not(:disabled){background:#333942;border-color:var(--y)}
.nav button:disabled{opacity:.32;cursor:default}

/* ---- surfaces --------------------------------------------------------------------------- */
section{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);
  margin-top:16px;padding:24px 26px;box-shadow:var(--sh-1)}
section.case{border-left:3px solid var(--y)}
section.case.done{border-left-color:var(--good)}
section.case.no{border-left-color:var(--warn)}
h2{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 16px;font-weight:700}
h2 .cnt{color:var(--ink-2);letter-spacing:0;text-transform:none;font-weight:500}
p{margin:0 0 10px}
.dim{color:var(--ink-2)}
.small{font-size:13px}
.k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-bottom:6px}

/* ---- status rail ------------------------------------------------------------------------ */
.rail{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;
  padding:9px 14px;border-radius:var(--r-ctl);margin-bottom:18px;border:1px solid}
.rail.ended{background:var(--y-tint);color:#7A5B00;border-color:var(--y-tint);}
.rail.live{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-rule)}
.rail.done{background:var(--good-bg);color:var(--good);border-color:var(--good-rule)}

h1{font-size:30px;line-height:1.24;margin:0 0 7px;font-weight:650;letter-spacing:-.02em;
  max-width:27ch}
.scope{font-size:13px;color:var(--ink-2);margin-bottom:24px}

/* ---- hero figures ----------------------------------------------------------------------- */
.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0 6px}
.hero{border-left:3px solid var(--rule);padding-left:14px}
.hero:first-child{border-left-color:var(--y)}
.hero .v{font-size:40px;line-height:1.05;font-weight:650;letter-spacing:-.03em}
.hero .l{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.4}

/* ---- numerals are buttons --------------------------------------------------------------- */
.n{background:none;border:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;
  border-bottom:1px dotted var(--ink-4);text-align:left}
.n:hover{border-bottom-style:solid;border-bottom-color:var(--y);background:var(--y-tint-2)}
.n:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{
  outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}

/* ---- callouts --------------------------------------------------------------------------- */
.callout{border:1px solid var(--y-tint);background:var(--y-tint-2);border-radius:var(--r-ctl);
  padding:15px 18px;margin:20px 0;border-left:3px solid var(--y)}
.callout .k{color:#7A5B00}
.callout.stop{border-color:var(--bad-rule);background:var(--bad-bg);border-left-color:var(--bad)}
.callout.stop .k{color:var(--bad)}

/* ---- progress tracker ------------------------------------------------------------------- */
.track{display:flex;align-items:flex-start;margin:26px 0 8px;padding:0}
.step{flex:1;position:relative;text-align:center;padding-top:26px}
.step:before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;
  background:var(--rule)}
.step:first-child:before{left:50%}
.step:last-child:before{right:50%}
.step.done:before,.step.now:before{background:var(--y)}
.step i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:15px;height:15px;
  border-radius:50%;background:var(--surface);border:2px solid var(--rule);display:block}
.step.done i{background:var(--y);border-color:var(--y)}
.step.now i{background:var(--surface);border-color:var(--y);box-shadow:0 0 0 4px var(--y-tint)}
.step .lab{font-size:12.5px;color:var(--ink-3);font-weight:600}
.step.done .lab{color:var(--ink)}
.step.now .lab{color:var(--ink)}
.step .sub{font-size:11.5px;color:var(--ink-4);margin-top:2px}

/* ---- ask row ---------------------------------------------------------------------------- */
.askrow{display:grid;grid-template-columns:200px 1fr;gap:26px;margin-top:22px;
  padding-top:22px;border-top:1px solid var(--rule-2)}
.chip{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;
  padding:6px 12px;font-size:12.5px;font-weight:600;margin:0 6px 6px 0}

/* ---- evidence --------------------------------------------------------------------------- */
.ev{padding:18px 0;border-top:1px solid var(--rule-2)}
.ev:first-of-type{border-top:none;padding-top:4px}
.ev .top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.ev .nm{font-weight:650;min-width:215px}
.bar{height:10px;background:var(--rule-2);border-radius:5px;overflow:hidden;
  margin:10px 0 8px;max-width:430px}
.bar i{display:block;height:100%;background:var(--ink-2);border-radius:5px}
.bar.bad i{background:var(--bad)}
.prov{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Provenance and status marks drawn in CSS, not typed as glyphs: the half-circle characters do
   not exist in every fallback font and rendered as stray brackets. */
.fid{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;
  border:1.5px solid currentColor}
.fid.measured{background:currentColor}
.fid.derived{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.fid.judged{background:radial-gradient(circle,currentColor 34%,transparent 35%)}
.rmark{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;
  border:2px solid currentColor}
.rmark.live{background:currentColor}
.rmark.ended{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.base{font-size:13.5px;color:var(--ink-2);margin-top:10px;max-width:78ch;
  border-left:3px solid var(--y);padding-left:13px;background:var(--y-tint-2);
  padding-top:9px;padding-bottom:9px;border-radius:0 6px 6px 0}
.raw{font:12px/1.7 var(--mono);color:var(--ink-2);background:var(--bg);border:1px solid var(--rule-2);
  border-radius:var(--r-ctl);padding:13px 15px;margin-top:12px;white-space:pre-wrap;overflow-x:auto}

/* ---- disclosure ------------------------------------------------------------------------- */
details{margin-top:13px}
summary{cursor:pointer;font-size:12.5px;color:var(--ink);font-weight:650;list-style:none;
  display:inline-block;padding:4px 0;border-bottom:1.5px solid var(--y)}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";font-size:10px;color:var(--ink-3)}
details[open]>summary:before{content:"▾ "}

/* ---- agent trace ------------------------------------------------------------------------ */
.trace{margin-top:14px;border-left:2px solid var(--rule);padding-left:0}
.trace .tr{position:relative;padding:11px 0 11px 22px;border-bottom:1px solid var(--rule-2)}
.trace .tr:last-child{border-bottom:none}
.trace .tr:before{content:"";position:absolute;left:-5px;top:17px;width:8px;height:8px;
  border-radius:50%;background:var(--y);border:2px solid var(--surface)}
.trace .th{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13.5px}
.trace .th b{font-weight:650}
.trace .tv{font:11.5px/1.7 var(--mono);color:var(--ink-2);margin-top:5px;white-space:pre-wrap}

/* ---- actions ---------------------------------------------------------------------------- */
.acts{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-ctl);
  padding:13px 26px;font-size:14.5px;font-weight:650;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--bg);border-color:var(--ink-4)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#000}
.btn.warn:hover{background:var(--bad-bg);border-color:var(--bad-rule);color:var(--bad)}
.btn.sm{padding:7px 14px;font-size:13px;font-weight:600}
.receipt{border:1px solid var(--rule);border-radius:var(--r-card);padding:17px 19px;margin-top:20px}
.receipt.ok{background:var(--good-bg);border-color:var(--good-rule)}
.receipt.no{background:var(--warn-bg);border-color:var(--warn-rule)}
.receipt.df{background:var(--bg)}
.receipt .hd{font-weight:700;font-size:14.5px;margin-bottom:6px;display:flex;gap:9px;
  align-items:center;flex-wrap:wrap}

/* ---- audit trail ------------------------------------------------------------------------ */
.audit{margin-top:16px;border-top:1px solid var(--rule-2);padding-top:14px}
.audit .en{position:relative;padding:12px 0 12px 24px;border-left:2px solid var(--rule);
  margin-left:4px}
.audit .en:before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;
  border-radius:50%;background:var(--ink-4);border:2px solid var(--surface)}
.audit .en.last:before{background:var(--y)}
.audit .eh{font-size:13.5px;font-weight:650;display:flex;gap:9px;align-items:baseline;
  flex-wrap:wrap}
.audit .em{font:11.5px var(--mono);color:var(--ink-3)}

/* ---- dismissals / gaps ------------------------------------------------------------------ */
.dis{border-top:1px solid var(--rule-2);padding:16px 0}
.dis:first-of-type{border-top:none;padding-top:2px}
.dis .hd{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border-radius:5px;padding:3px 8px;white-space:nowrap}
.tag.grey{background:var(--rule-2);color:var(--ink-2)}
.tag.red{background:var(--bad-bg);color:var(--bad)}
.tag.green{background:var(--good-bg);color:var(--good)}
.tag.amber{background:var(--y-tint);color:#7A5B00}
.gap{border-top:1px solid var(--rule-2);padding:20px 0}
.gap:first-of-type{border-top:none;padding-top:2px}
.spec{font:12.5px/1.8 var(--mono);background:var(--ink);color:#DDE5EE;border-radius:var(--r-ctl);
  padding:15px 17px;margin-top:12px;overflow-x:auto;white-space:pre}
.spec .c{color:var(--y)}

/* ---- footer ----------------------------------------------------------------------------- */
.frozen{margin-top:18px;padding:16px 20px;border:1px dashed var(--rule);
  border-radius:var(--r-card);font-size:13px;color:var(--ink-2);display:flex;gap:12px;
  align-items:flex-start;background:var(--y-tint-2)}

/* ---- modal ------------------------------------------------------------------------------ */
.scrim{position:fixed;inset:0;background:rgba(16,19,26,.46);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:24px}
.modal{background:var(--surface);border-radius:14px;max-width:620px;width:100%;padding:26px 28px;
  max-height:86vh;overflow:auto;box-shadow:var(--sh-2)}
.modal h3{margin:0 0 14px;font-size:18px;font-weight:650}
.modal label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin:16px 0 6px}
.modal input,.modal textarea{width:100%;font:14px var(--sans);padding:10px 12px;
  border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink)}
.modal input:focus,.modal textarea:focus{outline:2px solid var(--y);outline-offset:-1px;
  border-color:var(--y)}
.modal textarea{min-height:82px;resize:vertical}
.reasons{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.reasons button{font-size:12.5px;padding:6px 13px;border:1px solid var(--rule);border-radius:99px;
  background:var(--surface);cursor:pointer;color:var(--ink-2)}
.reasons button:hover{background:var(--y-tint);border-color:var(--y);color:var(--ink)}
.confirm{background:var(--bg);border:1px solid var(--rule-2);border-radius:var(--r-ctl);
  padding:14px 16px;margin:18px 0;font:12.5px/1.85 var(--mono);color:var(--ink-2);
  white-space:pre-wrap}
.err{background:var(--bad-bg);border:1px solid var(--bad-rule);color:var(--bad);
  border-radius:var(--r-ctl);padding:11px 14px;margin-top:14px;font-size:13.5px}
.pop{position:absolute;z-index:200;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-card);box-shadow:var(--sh-2);padding:17px 19px;max-width:440px;
  font-size:13.5px;border-top:3px solid var(--y)}
.pop .t{font-weight:700;margin-bottom:8px}
.pop dt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-top:12px}
.pop dd{margin:4px 0 0}
.pop .lock{margin-top:14px;padding-top:11px;border-top:1px solid var(--rule-2);
  font-size:12.5px;color:var(--ink-3)}
.loading{padding:80px 20px;text-align:center;color:var(--ink-3)}

@media (max-width:900px){
  .heroes{grid-template-columns:repeat(2,1fr)}
  .askrow{grid-template-columns:1fr;gap:16px}
  h1{font-size:25px}
  .track{flex-wrap:wrap;gap:12px}
  .step{flex:1 1 40%}
}
</style>
</head>
<body>
<div class="sysbar"><div class="in" id="sysbar"></div></div>
<div class="wrap" id="app"><div class="loading">Reading loop-report.json&hellip;</div></div>
<div id="overlay"></div>
<script>
/* Loop Desk - one screen, one decision.
 *
 * Everything on this page is rendered from loop-report.json. There is not a single day number,
 * tenant name, cohort key, metric name or count written into this file, because the sealed run
 * moves all of them. If the report says something different, the screen says something different.
 */
'use strict';

var R = null, IDX = null, cur = 0;
var $ = function (s, r) { return (r || document).querySelector(s); };
var el = function (t, c, x) { var e = document.createElement(t); if (c) e.className = c;
  if (x != null) e.textContent = x; return e; };
var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s;
  return d.innerHTML; };

/* ---------- formatting -------------------------------------------------------------------- */
function fmtInt(n) { return n == null ? '--' : Number(n).toLocaleString('en-GB'); }
function fmtPct(v, dp) { return v == null ? '--' : (v * 100).toFixed(dp == null ? 1 : dp) + '%'; }
function fmtUsd(v) {
  if (v == null) return '--';
  v = Number(v);
  return '$' + (v >= 100 ? Math.round(v).toLocaleString('en-GB') : v.toFixed(2));
}
/* Coverage below 1.0 means the figure describes part of the traffic, so trailing decimals are
 * false precision. Round to what the coverage can actually support. */
function sigFor(coverage) { return (coverage != null && coverage < 0.95) ? 2 : 4; }

/* ---------- indexing ---------------------------------------------------------------------- */
function buildIndex(rep) {
  var byFinding = {}, byDiag = {}, byPres = {}, presById = {}, diagById = {};
  (rep.diagnoses || []).forEach(function (d) { byFinding[d.finding_id] = d; diagById[d.id] = d; });
  (rep.prescriptions || []).forEach(function (p) { byDiag[p.diagnosis_id] = p; presById[p.id] = p; });
  (rep.verifications || []).forEach(function (v) {
    (byPres[v.prescription_id] = byPres[v.prescription_id] || []).push(v);
  });

  /* Per-tenant coverage, read out of metrics[]. Never blended: a single figure across tenants
   * describes neither deployment, and the report states them separately for that reason. */
  var cov = {};
  (rep.metrics || []).forEach(function (m) {
    var c = m.coverage || {};
    if (c.value == null) return;
    (rep.findings || []).forEach(function (f) {
      var slug = String(f.tenant || '').replace(/\W+/g, '_');
      if (slug && m.id && m.id.indexOf(slug) >= 0 && cov[f.tenant] == null) {
        cov[f.tenant] = { value: c.value, basis: c.basis, excluded: c.excluded || [] };
      }
    });
  });
  var cal = null;
  (rep.metrics || []).forEach(function (m) { if (m.calibration && cal == null) cal = m.calibration; });

  return { byFinding: byFinding, byDiag: byDiag, byPres: byPres, presById: presById,
           diagById: diagById, cov: cov, cal: cal,
           regs: (rep.findings || []).filter(function (f) { return f.is_regression; }),
           dis: (rep.findings || []).filter(function (f) { return !f.is_regression; }) };
}

/* Resolve the honesty envelope for one number on one finding.
 *
 * Coverage is looked up for THIS series, not borrowed from a neighbouring one. The pipeline
 * measures it per tenant: by full series name for session fields (s.cost_usd, s.quality_score@v1)
 * and by step type for step series (tool_call, kb_lookup). Falling back to a tenant-wide figure
 * would put the tool_call hole's 72% next to knowledge-base numbers that actually cover 100%.
 */
function envelope(f, meta) {
  meta = meta || {};
  var name = meta.name || '';
  var measured = (R.coverage_measured || {})[f.tenant] || {};
  var cov = measured[name];
  if (cov == null && name.indexOf('.') > 0 && !/^s\./.test(name)) cov = measured[name.split('.')[0]];
  var out = { fidelity: meta.fidelity || 'derived', definition: meta.definition || '',
              plain: meta.plain || '' };
  var tenantCov = IDX.cov[f.tenant];
  if (cov != null) {
    out.coverage = cov;
    out.coverageBasis = cov >= 1
      ? 'Measured: every conversation on this tenant can produce this number. Nothing is excluded.'
      : 'Measured: the share of this tenant\u2019s conversations that can produce this number at '
        + 'all. The rest cannot \u2014 that is not a sample, it is a structural blind spot.';
    out.excluded = cov < 1 && tenantCov ? (tenantCov.excluded || []) : [];
  } else if (meta.basis === 'step') {
    out.coverage = tenantCov ? tenantCov.value : null;
    out.coverageBasis = tenantCov ? tenantCov.basis
      : 'Coverage for this series is not stated in the report.';
    out.excluded = tenantCov ? tenantCov.excluded : [];
  } else {
    out.coverage = 1.0;
    out.coverageBasis = 'Every conversation can produce this number; nothing is excluded.';
    out.excluded = [];
  }
  out.calibration = out.fidelity === 'judged' ? IDX.cal : null;
  return out;
}

/* ---------- the numeral popover ----------------------------------------------------------- */
/* One interaction, applied to every numeral on the page. This is the literal rubric clause:
 * "does every number carry its definition". */
function num(text, info, cls) {
  var b = el('button', 'n' + (cls ? ' ' + cls : ''), text);
  b.type = 'button';
  b.setAttribute('aria-haspopup', 'dialog');
  b.addEventListener('click', function (e) { e.stopPropagation(); showPop(b, info); });
  return b;
}

function showPop(anchor, info) {
  closePop();
  var p = el('div', 'pop');
  p.setAttribute('role', 'dialog');
  p.appendChild(el('div', 't', info.title || 'This number'));
  var dl = el('dl');
  function row(k, v) {
    if (v == null || v === '') return;
    dl.appendChild(el('dt', null, k));
    dl.appendChild(el('dd', null, v));
  }
  row('What it is', info.definition);
  var FID = { measured: 'Measured - counted directly in the logs. We know this happened.',
              derived: 'Derived - calculated from things we counted. No opinion involved.',
              judged: 'Judged - a model read the conversation and formed an opinion.' };
  row('How we know it', FID[info.fidelity] || info.fidelity);
  if (info.coverage != null) {
    row('Coverage', fmtPct(info.coverage, 0) + ' of this deployment’s conversations. '
        + (info.coverageBasis || ''));
    if (info.coverage < 1 && (info.excluded || []).length) {
      row('Excluded', info.excluded.join('; ')
          + ' — this is not a sample, it is a structural blind spot: that traffic cannot '
          + 'produce this number at all.');
    }
  }
  if (info.calibration) {
    var ag = info.calibration.agreement;
    if (ag >= 0.995) {
      row('Calibration', '⚠ Suspiciously perfect (' + ag.toFixed(4) + ') — investigate. '
          + 'Human reviewers disagree with each other, so perfect agreement means something is '
          + 'wrong, not that the judge is excellent.');
    } else {
      row('Calibration', 'Agrees with human reviewers ' + fmtPct(ag, 0) + ' of the time (n='
          + info.calibration.n + (info.calibration.judge_version ? ', judge '
          + info.calibration.judge_version : '') + '). '
          + (info.calibration.basis || '')
          + ' Human labellers disagree with each other about 7.5% of the time, so agreement of '
          + '1.00 would be a bug, not a good judge.');
    }
  } else if (info.fidelity === 'judged') {
    row('Calibration', 'Not published. No human labels exist for this question in the kit, so '
        + 'agreement cannot be computed and none is claimed.');
  } else {
    row('Calibration', 'Not applicable — this is not a judged number.');
  }
  row('How it was computed', info.derivation);
  row('Rounding', info.rounding);
  p.appendChild(dl);
  var lk = el('div', 'lock', '🔒 Definition frozen — v1.0. This system proposes '
      + 'changes to the agent, never to the yardstick.');
  p.appendChild(lk);

  document.body.appendChild(p);
  var r = anchor.getBoundingClientRect();
  var top = r.bottom + window.scrollY + 7;
  var left = Math.min(r.left + window.scrollX, window.scrollX + window.innerWidth - p.offsetWidth - 16);
  if (top + p.offsetHeight > window.scrollY + window.innerHeight) {
    top = Math.max(window.scrollY + 8, r.top + window.scrollY - p.offsetHeight - 7);
  }
  p.style.top = top + 'px';
  p.style.left = Math.max(8, left) + 'px';
  setTimeout(function () { document.addEventListener('click', closePop, { once: true }); }, 0);
}
function closePop() { var p = $('.pop'); if (p) p.remove(); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); closeModal(); } });

/* ---------- evidence-line parser ---------------------------------------------------------- */
/* The scanner emits evidence as prose in a stable shape. Parsing it back into a value, a
 * baseline and a direction is what lets the screen draw a comparison instead of printing a log
 * line at an operator. Anything that does not match is shown as-is, never dropped. */
var EV_RE = /^(\S+) on (.+?), days (\d+)-(\d+): ([\d.]+) -> ([\d.]+) \(([+-]?[\d.]+)%, z=([\d.]+)(?:, baseline: (.+?))?\)\s*$/;
function parseEvidence(s) {
  var m = EV_RE.exec(s);
  if (!m) return { raw: s };
  return { series: m[1], where: m[2], from_day: +m[3], to_day: +m[4],
           base: parseFloat(m[5]), obs: parseFloat(m[6]), pct: parseFloat(m[7]),
           z: parseFloat(m[8]), basis: m[9] || null, raw: s };
}

/* ---------- the finding ------------------------------------------------------------------- */

/* A report emitted before the language layer carries no title_plain. Compose one from the cause
 * class and the cohort rather than showing a finding id to a person. */
var FALLBACK_TITLE = {
  'kb.gap': 'Customers asking about {c} are not getting a useful answer.',
  'tool.contract_break': 'A tool behind {c} reports success while returning nothing.',
  'tool.outage': 'A tool behind {c} is failing outright.',
  'prompt.regression': 'Conversations in {c} got longer and more expensive without getting better.',
  'model.change': 'A model change altered how {c} behaves.',
  'routing.error': 'Conversations in {c} are being sent to the wrong place.',
  'traffic_mix': 'The mix of questions changed - the totals moved, the service did not.',
  'load': 'Traffic ran far above normal and the platform slowed down, then recovered.',
  'judge_change': 'The quality-scoring rubric changed version - the scores moved, the agents did not.'
};
function fallbackCohort(f) {
  var c = f.cohort || {}, k = Object.keys(c)[0];
  if (!k) return 'all ' + f.tenant + ' traffic';
  var v = String(c[k]);
  if (k === 'intent') return v.replace(/_(info|enquiry|query)$/, '').replace(/_/g, ' ')
    .replace(/\b\w/g, function (m) { return m.toUpperCase(); }) + ' enquiries';
  if (k === 'tool' || k === 'tool_name') return 'the ' + v + ' tool';
  if (k === 'agent_id') return 'the ' + v + ' agent';
  return v.replace(/_/g, ' ');
}
function fallbackTitle(f, d) {
  var t = FALLBACK_TITLE[(d || {}).cause_class];
  var c = fallbackCohort(f);
  if (t) return t.replace('{c}', c);
  return f.is_regression ? 'Service quality dropped in ' + c + '.'
                         : c.charAt(0).toUpperCase() + c.slice(1) + ' looked like a problem and is not one.';
}


/* The loop's five stages, named the way an operator would say them. Detection, Diagnosis,
 * Prescription and Verification are this architecture's words, and putting them in front of
 * someone who runs a bank's support line is the same mistake as opening a demo on a diagram. */
function renderTrack(f, d, p, approved) {
  var vs = p ? (IDX.byPres[p.id] || []).filter(function (v) { return !v.is_alternative; }) : [];
  var steps = [
    { lab: 'Found it', sub: f.status_plain ? 'days ' + f.window.from_day + '\u2013' + f.window.to_day : '',
      done: true },
    { lab: 'Explained it',
      sub: d && d.attributed_change ? 'day ' + d.attributed_change.day + ' \u00b7 ' + d.attributed_change.kind + ' change'
           : (d ? 'no change attributed' : ''), done: !!d },
    { lab: 'Proposed a fix', sub: p ? p.change_type : 'none proposed', done: !!p },
    { lab: 'Tested it',
      sub: vs.length ? (vs[0].verdict === 'improved' ? 'improved on replay' : vs[0].verdict.replace('_', ' '))
           : 'not verified', done: !!vs.length },
    { lab: 'Your call', sub: approved ? 'recorded' : 'waiting on you', done: !!approved }
  ];
  var t = el('div', 'track');
  var firstOpen = steps.findIndex(function (x) { return !x.done; });
  steps.forEach(function (x, i) {
    var cls = x.done ? 'step done' : (i === firstOpen ? 'step now' : 'step');
    var e = el('div', cls);
    e.appendChild(el('i'));
    e.appendChild(el('div', 'lab', x.lab));
    if (x.sub) e.appendChild(el('div', 'sub', x.sub));
    t.appendChild(e);
  });
  return t;
}

/* ---------- WHAT WE MEASURED -------------------------------------------------------------- */
function renderMeasured(f) {
  var s = el('section');
  s.appendChild(el('h2', null, 'What we measured'));
  var rows = (f.evidence || []).map(parseEvidence);
  var numeric = rows.filter(function (r) { return r.series; });
  var notes = rows.filter(function (r) { return !r.series; });

  if (!numeric.length && !notes.length) s.appendChild(el('p', 'dim', 'No evidence rows recorded.'));

  /* One claim per row: name, value, bar, baseline, provenance. Never a table of twelve metrics. */
  numeric.slice(0, 4).forEach(function (r, i) {
    var meta = (i === 0 && f.metric_plain && f.metric_plain.name === r.series)
      ? f.metric_plain : guessMeta(r.series);
    var env = envelope(f, meta);
    var d = el('div', 'ev');
    var top = el('div', 'top');
    top.appendChild(el('div', 'nm', meta.plain || r.series));
    var dp = sigFor(env.coverage);
    var shown = fmtMeasure(r.obs, meta, env.coverage),
        baseShown = fmtMeasure(r.base, meta, env.coverage);
    top.appendChild(num(shown, {
      title: meta.plain || r.series, definition: meta.definition, fidelity: env.fidelity,
      coverage: env.coverage, coverageBasis: env.coverageBasis, excluded: env.excluded,
      calibration: env.calibration,
      derivation: r.raw,
      rounding: env.coverage != null && env.coverage < 0.95
        ? 'Shown to ' + dp + ' decimal places because coverage is '
          + fmtPct(env.coverage, 0) + ' — more would be false precision.'
        : null }));
    top.appendChild(el('span', 'dim small', 'vs ' + baseShown + ' baseline · '
      + (r.pct > 0 ? '+' : '') + r.pct + '% · z=' + r.z));
    d.appendChild(top);

    var worse = meta.higher_is_better === true ? r.obs < r.base
      : meta.higher_is_better === false ? r.obs > r.base : false;
    var mx = Math.max(Math.abs(r.obs), Math.abs(r.base)) || 1;
    var bar = el('div', 'bar' + (worse ? ' bad' : ''));
    var fill = el('i');
    fill.style.width = Math.min(100, Math.abs(r.obs) / mx * 100) + '%';
    bar.appendChild(fill);
    d.appendChild(bar);

    var CH = { measured: 'Measured', derived: 'Derived', judged: 'Judged' };
    var prov = el('div', 'prov');
    var mark = el('span');
    mark.style.display = 'inline-flex';
    mark.style.gap = '6px';
    mark.style.alignItems = 'center';
    mark.appendChild(el('i', 'fid ' + env.fidelity));
    mark.appendChild(document.createTextNode(CH[env.fidelity] || env.fidelity));
    prov.appendChild(mark);
    prov.appendChild(el('span', null, '·'));
    prov.appendChild(el('span', null, 'covers ' + fmtPct(env.coverage, 0) + ' of ' + f.tenant));
    if (r.where) { prov.appendChild(el('span', null, '·')); prov.appendChild(el('span', null, r.where)); }
    d.appendChild(prov);

    if (i === 0 && f.baseline && f.baseline.justification) {
      var b = el('div', 'base');
      b.appendChild(el('strong', null, 'Baseline: '
        + (f.baseline.type === 'peer_traffic' ? 'peer traffic. ' : 'its own history. ')));
      b.appendChild(document.createTextNode(f.baseline.justification));
      d.appendChild(b);
    }
    s.appendChild(d);
  });

  notes.forEach(function (r) { s.appendChild(el('p', 'small dim', '• ' + r.raw)); });

  /* Disclosure reveals HOW we know, never WHAT we claim. */
  var det = el('details');
  det.appendChild(el('summary', null, 'Show the full working'));
  if ((f.impact || {}).derivation) {
    det.appendChild(el('div', 'k', 'Derivation'));
    det.appendChild(el('div', 'raw', f.impact.derivation));
  }
  if (rows.length > 4) {
    det.appendChild(el('div', 'k', 'Every series that moved'));
    det.appendChild(el('div', 'raw', (f.evidence || []).join('\n')));
  }
  s.appendChild(det);

  var refused = [];
  (R.metrics || []).forEach(function (m) {
    ((m.plan || {}).refused_breakdowns || []).forEach(function (x) {
      if (refused.indexOf(x) < 0) refused.push(x);
    });
  });
  if (refused.length) {
    var line = el('p', 'small dim');
    line.style.marginTop = '12px';
    line.appendChild(document.createTextNode('Breakdowns we refused rather than truncated: '
      + refused.join('; ') + '.'));
    s.appendChild(line);
  }
  return s;
}

function fmtNum(v, dp) {
  if (v == null) return '--';
  if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString('en-GB');
  var t = Number(v).toFixed(dp);
  return t.replace(/\.?0+$/, '') || '0';
}

/* A rate reads as a percentage to a person and as a decimal to a machine. The operator gets the
 * percentage; the exact stored value is in the popover. Money, milliseconds, scores and counts
 * keep their own units - "0.25" is a match score, not 25% of anything. */
function fmtMeasure(v, meta, coverage) {
  if (v == null) return '--';
  var u = (meta || {}).unit;
  if (u === 'rate') return fmtPct(v, (coverage != null && coverage < 0.95) ? 1 : (Math.abs(v) < 0.1 ? 1 : 0));
  if (u === 'usd') return fmtUsd(v);
  if (u === 'ms') return Math.round(v).toLocaleString('en-GB') + ' ms';
  return fmtNum(v, sigFor(coverage));
}

/* Fallback metadata for a series the report did not annotate. Mirrors nexus/language.py so the
 * screen degrades to a sentence rather than a raw key. */
var SESSION_META = {
  's.resolved': ['Resolution rate', 'measured', true, 'rate',
    'Share of conversations that ended resolved.'],
  's.milestones_complete': ['Journey completion rate', 'measured', true, 'rate',
    'Share of conversations that reached every milestone their intent defines.'],
  's.milestone_ratio': ['Journey progress', 'derived', true, 'rate',
    'Average share of an intent\u2019s milestones reached before the conversation ended.'],
  's.handoff_unplanned': ['Unplanned handoffs', 'measured', false, 'rate',
    'Share of conversations handed to a human the journey never intended to involve.'],
  's.abandoned': ['Abandonment rate', 'measured', false, 'rate',
    'Share of conversations the customer left without resolving. How many gave up is measured; '
    + 'why they gave up is not \u2014 see the refused questions.'],
  's.turns': ['Exchanges per conversation', 'measured', false, 'count',
    'Back-and-forth turns before the conversation ended.'],
  's.duration_s': ['Conversation length', 'measured', false, 'count',
    'Wall-clock seconds from first to last turn.'],
  's.cost_usd': ['Cost per conversation', 'measured', false, 'usd',
    'Model spend per conversation, summed over its llm_call steps.'],
  's.tool_error_any': ['Conversations hitting a tool error', 'derived', false, 'rate',
    'Share of conversations with at least one tool call that did not return ok. Declared '
    + 'failures only \u2014 a tool returning 200 with an empty body counts as a success here.'],
  's.guardrail_any': ['Conversations hitting a guardrail', 'measured', false, 'rate',
    'Share of conversations where at least one guardrail step fired.']
};

function guessMeta(series) {
  if (SESSION_META[series]) {
    var x = SESSION_META[series];
    return { name: series, plain: x[0], fidelity: x[1], higher_is_better: x[2], unit: x[3],
             definition: x[4], basis: series === 's.cost_usd' ? 'step' : 'session' };
  }
  var NOUN = { tool_call: 'tool call', kb_lookup: 'knowledge-base lookup', llm_call: 'model call',
               guardrail: 'guardrail', handoff: 'handoff', turn: 'turn' };
  var SUF = { fail: ['failure rate', 'measured', false, 'rate'],
              empty: ['empty-response rate', 'derived', false, 'rate'],
              miss: ['miss rate', 'measured', false, 'rate'],
              retry: ['retry rate', 'measured', false, 'rate'],
              duration_ms: ['response time', 'measured', false, 'ms'],
              timeout: ['timeout rate', 'measured', false, 'rate'],
              blocked: ['blocked rate', 'measured', false, 'rate'],
              top_score: ['best match score', 'measured', true, 'score'],
              tokens: ['tokens used', 'measured', false, 'count'] };
  if (series.indexOf('share:') === 0) {
    return { name: series, plain: 'Share of traffic by ' + series.split(':')[1],
             fidelity: 'derived', basis: 'session', higher_is_better: null, unit: 'rate',
             definition: 'What proportion of traffic each value accounts for. A change here moves '
               + 'every aggregate without anything getting better or worse.' };
  }
  if (series.indexOf('s.quality_score') === 0) {
    return { name: series, plain: 'Judged quality', fidelity: 'judged', basis: 'session',
             higher_is_better: true, unit: 'score',
             definition: 'A model’s 1-5 score for the conversation, comparable only within '
               + 'one rubric version.' };
  }
  var parts = series.split('.');
  if (parts.length === 2 && SUF[parts[1]]) {
    var n = NOUN[parts[0]] || parts[0].replace(/_/g, ' '), t = SUF[parts[1]];
    return { plain: n.charAt(0).toUpperCase() + n.slice(1) + ' ' + t[0], fidelity: t[1],
             basis: 'step', higher_is_better: t[2],
             definition: 'Measured on ' + n + ' steps in the agent’s execution log.' };
  }
  return { name: series, plain: series.replace(/^s\./, '').replace(/[_.]/g, ' '),
           fidelity: 'derived', basis: 'session', higher_is_better: null, unit: 'count',
           definition: 'Computed from the deployment’s own logs.' };
}

/* ---------- WHY IT HAPPENED --------------------------------------------------------------- */
function renderWhy(f) {

    s.appendChild(line);

    if (detail) s.appendChild(el('p', 'small dim', detail));
  } else {
    s.appendChild(el('p', null, 'No configuration change lines up with this window.'));
  }
  if (d.attribution_confidence_plain) {
    var tag = el('span', 'tag amber');
    tag.style.display = 'inline-flex';
    tag.style.gap = '6px';
    tag.style.alignItems = 'center';
    tag.appendChild(el('i', 'fid derived'));
    tag.appendChild(document.createTextNode(d.attribution_confidence_plain));
    s.appendChild(tag);
  }
  if (d.attribution_plain) {
    var ap = el('p', 'small dim');

  }
  var p = IDX.byDiag[d.id];

  var det = el('details');

  det.appendChild(renderTrace(f, d));
  s.appendChild(det);
  return s;
}


/* How we got here: the steps the system actually ran, with what each one looked at and what it
 * returned. This is the "show your working" layer - it reveals HOW we know, never WHAT we claim.
 * If a judge has to open this to find out what is being asserted, the screen has failed. */
function renderTrace(f, d) {
  var w = el('div', 'trace');
  function step(name, meta, body) {
    var r = el('div', 'tr');
    var h = el('div', 'th');
    h.appendChild(el('b', null, name));
    if (meta) h.appendChild(el('span', 'small dim', meta));
    r.appendChild(h);
    if (body) r.appendChild(el('div', 'tv', body));
    w.appendChild(r);
  }
  var series = (f.evidence || []).map(parseEvidence).filter(function (x) { return x.series; });
  step('Scanned every metric \u00d7 cohort series', 'changepoint test, overdispersion-adjusted',
       series.length ? series.length + ' series moved in this window; the strongest is '
         + series[0].series + ' at z=' + series[0].z
       : 'no numeric series parsed for this finding');
  step('Localised it to a cohort', 'breadth test',
       'cohort ' + JSON.stringify(f.cohort) + '\ntenant ' + f.tenant
       + '\nwindow days ' + f.window.from_day + '\u2013' + f.window.to_day);
  step('Chose a baseline', (f.baseline || {}).type || '',
       (f.baseline || {}).basis || 'not recorded');
  step('Ruled out the other explanations', 'explain-away test',
       (d.evidence || []).join('\n'));
  step('Named a cause', 'confidence ' + (d.confidence != null ? d.confidence : 'n/a'),
       'cause_class = ' + d.cause_class
       + (d.attributed_change
          ? '\nattributed to a ' + d.attributed_change.kind + ' change on day ' + d.attributed_change.day
          : '\nno configuration change lines up with this window'));
  return w;
}

/* ---------- WHAT WE PROPOSE + DID IT WORK + the gate -------------------------------------- */
function renderPropose(f) {
  var d = IDX.byFinding[f.id] || {};
  var p = IDX.byDiag[d.id];
  if (!p) return null;
  var s = el('section');
  s.appendChild(el('h2', null, 'What we propose'));
  s.appendChild(el('p', null, p.description || ''));

  var pd = p.predicted_delta || {};
  if (pd.metric) {
    var meta = p.predicted_delta_plain || guessMeta(pd.metric);
    var env = envelope(f, meta);
    var pr = el('p', 'small');
    pr.appendChild(el('strong', null, 'Predicted: '));
    pr.appendChild(document.createTextNode((meta.plain || pd.metric) + ' '));
    pr.appendChild(num(fmtMeasure(pd.from, meta, env.coverage), {
      title: 'Where it is now', definition: meta.definition, fidelity: env.fidelity,
      coverage: env.coverage, coverageBasis: env.coverageBasis, derivation: 'Observed in the window.' }));
    pr.appendChild(document.createTextNode(' → about '));
    pr.appendChild(num(fmtMeasure(pd.to, meta, env.coverage), {
      title: 'Where we predict it lands', definition: 'The baseline this cohort is measured '
        + 'against. Predicting a return to baseline is what makes the claim falsifiable.',
      fidelity: 'derived', coverage: env.coverage, coverageBasis: env.coverageBasis,
      derivation: 'Baseline for this cohort; see the baseline justification above.' }));
    s.appendChild(pr);
  }

  if (p.decision && p.decision.would_not_ship_if) {
    var st = el('div', 'callout');
    st.appendChild(el('div', 'k', '⛔  Pre-committed stop condition'));
    st.appendChild(el('p', null, p.decision.would_not_ship_if));
    s.appendChild(st);
  }

  /* DID IT WORK */
  var vs = IDX.byPres[p.id] || [];
  s.appendChild(el('h2', null, 'Did it work'));
  if (!vs.length) {
    var nv = el('p', 'dim');
    nv.textContent = 'Not verified. This fix has not been put to the replay service, so there is '
      + 'no before-and-after for it. A fix with no evidence behind it is a hope, and the screen '
      + 'says so rather than implying otherwise.';
    s.appendChild(nv);
  }
  vs.forEach(function (v) {
    /* A fix that improved the cohort and broke the golden set is not a green result: the stop
     * condition we pre-committed to has fired, so it reads as the blocked change it now is. */
    var box = el('div', 'receipt ' + (v.stop_condition_triggered ? 'no'
      : v.verdict === 'improved' ? 'ok'
      : v.verdict === 'regressed' ? 'no' : 'df'));
    var VI = { improved: '✓ Improved', no_effect: '— No effect',
               regressed: '✗ Made it worse' };
    var hd = el('div', 'hd');
    hd.appendChild(document.createTextNode(VI[v.verdict] || v.verdict));
    if (v.is_alternative) hd.appendChild(el('span', 'tag grey', 'alternative we tested'));
    if (v.golden_set_pass === false) hd.appendChild(el('span', 'tag red', 'golden set regressed'));
    if (v.golden_set_pass === true) hd.appendChild(el('span', 'tag green', 'golden set clean'));
    box.appendChild(hd);
    box.appendChild(el('p', 'small', v.plain || ''));
    if (v.alternative_note) box.appendChild(el('p', 'small dim', v.alternative_note));
    if (v.stop_condition_note) {
      var sc = el('p', 'small');
      sc.style.fontWeight = '600';
      sc.style.color = 'var(--bad)';
      sc.textContent = '⛔ ' + v.stop_condition_note;
      box.appendChild(sc);
    }
    if (v.prediction_error_not_computed_because) {
      box.appendChild(el('p', 'small dim', v.prediction_error_not_computed_because));
    } else if (v.prediction_error != null) {
      box.appendChild(el('p', 'small dim', 'Prediction error: ' + v.prediction_error
        + ' (predicted minus observed, on the same metric).'));
    }
    box.appendChild(el('p', 'small dim', 'ⓘ ' + (v.caveat || '')
      + '  Replay run ' + v.replay_run_id + '.'));
    s.appendChild(box);
  });

  s.appendChild(renderGate(f, p));
  return s;
}

/* ---------- the approval gate ------------------------------------------------------------- */
/* Deliberately no keyboard shortcut. Approving a change to a production agent should cost a
 * considered click; "can you approve this by accident" should have a good answer. */
var VERDICT_UI = {
  accepted: { cls: 'ok', word: 'ACCEPTED', icon: '✓', tail: 'approved for shipping' },
  rejected: { cls: 'no', word: 'REJECTED', icon: '✗', tail: 'not shipped — reason recorded' },
  deferred: { cls: 'df', word: 'DEFERRED', icon: '⏸', tail: 'escalated — no change made' }
};


/* The decision trail. Changing a decision APPENDS - the original is never overwritten, and both
 * stay visible. Timestamps are absolute: audit trails do not use "2 hours ago". */
function renderAudit(hist) {
  var w = el('div', 'audit');
  w.appendChild(el('div', 'k', 'Decision trail \u00b7 ' + hist.length + ' entr'
    + (hist.length === 1 ? 'y' : 'ies') + ', nothing overwritten'));
  hist.forEach(function (h, i) {
    var ui = VERDICT_UI[h.verdict] || VERDICT_UI.deferred;
    var e = el('div', 'en' + (i === hist.length - 1 ? ' last' : ''));
    var hd = el('div', 'eh');
    hd.appendChild(document.createTextNode(ui.icon + ' ' + ui.word));
    hd.appendChild(el('span', 'small dim', h.decided_by));
    e.appendChild(hd);
    e.appendChild(el('div', 'em', h.at + (h.report_build ? '  \u00b7  against ' + h.report_build : '')));
    e.appendChild(el('p', 'small', h.reason));
    w.appendChild(e);
  });
  return w;
}

function renderGate(f, p) {
  var wrap = el('div');
  var a = p.approval;
  if (a && a.verdict) {
    var ui = VERDICT_UI[a.verdict] || VERDICT_UI.deferred;
    var box = el('div', 'receipt ' + ui.cls);
    var hd = el('div', 'hd');
    hd.appendChild(document.createTextNode(ui.icon + ' ' + ui.word + ' · ' + ui.tail));
    box.appendChild(hd);
    box.appendChild(el('p', 'small', a.decided_by + ' · ' + a.at));
    var why = el('p', 'small');
    why.appendChild(el('strong', null, 'Reason: '));
    why.appendChild(document.createTextNode(a.reason));
    box.appendChild(why);
    var hist = p.approval_history || [];
    var bound = hist.length ? hist[hist.length - 1].report_build : null;
    if (bound) {
      box.appendChild(el('p', 'small dim', 'Recorded against report build ' + bound
        + (bound === R.report_build ? ' — the evidence on this screen.'
          : ' — WARNING: the report has been regenerated since.')));
    }
    if (hist.length) box.appendChild(renderAudit(hist));
    var acts = el('div', 'acts');
    var ch = el('button', 'btn sm', 'change decision');
    ch.type = 'button';
    ch.onclick = function () { openDecision(f, p, null); };
    acts.appendChild(ch);
    var vw = el('button', 'btn sm', 'view the change in loop-report.json');
    vw.type = 'button';
    vw.onclick = function () { showWritten(p); };
    acts.appendChild(vw);
    box.appendChild(acts);
    wrap.appendChild(box);
    return wrap;
  }

  var acts = el('div', 'acts');
  [['accepted', 'ACCEPT FIX', 'btn pri'], ['rejected', 'REJECT', 'btn warn'],
   ['deferred', 'DEFER — need more information', 'btn']].forEach(function (x) {
    var b = el('button', x[2], x[1]);
    b.type = 'button';
    b.onclick = function () { openDecision(f, p, x[0]); };
    acts.appendChild(b);
  });
  wrap.appendChild(acts);
  var note = el('p', 'small dim');
  note.style.marginTop = '10px';
  note.textContent = 'Whichever you choose is written into loop-report.json → prescriptions['
    + p.id + '].approval, with your name, the time, the reason, and the build hash of the '
    + 'evidence you are looking at. A rejection with a good reason is as complete an answer as '
    + 'an approval.';
  wrap.appendChild(note);
  return wrap;
}

var REASONS = {
  accepted: ['Evidence is unambiguous', 'Cheap and reversible', 'Replay result is convincing'],
  rejected: ['Diagnosis not convincing', 'Fix is too risky', 'Not worth the effort',
             'Owned by another team', 'Golden set regressed'],
  deferred: ['Need the owning team to confirm', 'Waiting on a business decision',
             'Want a narrower fix first']
};

function closeModal() { $('#overlay').innerHTML = ''; }

function openDecision(f, p, verdict) {
  var ov = $('#overlay');
  ov.innerHTML = '';
  var scrim = el('div', 'scrim');
  var m = el('div', 'modal');
  var state = { verdict: verdict || 'rejected' };

  m.appendChild(el('h3', null, 'Record a decision on this fix'));
  m.appendChild(el('p', 'small dim', p.decision ? p.decision.asking_approval_for : ''));

  m.appendChild(el('label', null, 'Your decision'));
  var vrow = el('div', 'reasons');
  var vbtns = {};
  ['accepted', 'rejected', 'deferred'].forEach(function (v) {
    var b = el('button', null, VERDICT_UI[v].word);
    b.type = 'button';
    vbtns[v] = b;
    b.onclick = function () { state.verdict = v; paint(); };
    vrow.appendChild(b);
  });
  m.appendChild(vrow);

  m.appendChild(el('label', null, 'Your name or email'));
  var who = el('input');
  who.value = localStorage.getItem('loopdesk.who') || '';
  who.placeholder = 'ops.lead@example.com';
  m.appendChild(who);

  var rlabel = el('label', null, 'Reason');
  m.appendChild(rlabel);
  var quick = el('div', 'reasons');
  m.appendChild(quick);
  var why = el('textarea');
  why.placeholder = 'Why this decision? This is recorded in the report.';
  m.appendChild(why);

  var conf = el('div', 'confirm');
  m.appendChild(conf);
  var errBox = el('div');
  m.appendChild(errBox);

  var acts = el('div', 'acts');
  var cancel = el('button', 'btn', 'Cancel');
  cancel.type = 'button';
  cancel.onclick = closeModal;
  var go = el('button', 'btn pri', 'Confirm');
  go.type = 'button';
  acts.appendChild(cancel);
  acts.appendChild(go);
  m.appendChild(acts);

  function paint() {
    ['accepted', 'rejected', 'deferred'].forEach(function (v) {
      var on = v === state.verdict;
      vbtns[v].style.background = on ? 'var(--ink)' : '#fff';
      vbtns[v].style.color = on ? '#fff' : 'var(--ink-2)';
      vbtns[v].style.borderColor = on ? 'var(--ink)' : 'var(--rule)';
    });
    rlabel.textContent = 'Reason (required)';
    quick.innerHTML = '';
    (REASONS[state.verdict] || []).forEach(function (r) {
      var b = el('button', null, r);
      b.type = 'button';
      b.onclick = function () { why.value = why.value ? why.value : r; why.focus(); };
      quick.appendChild(b);
    });
    conf.textContent =
      'writes to   loop-report.json → prescriptions[' + p.id + '].approval\n'
      + 'verdict     ' + state.verdict + '\n'
      + 'change      ' + p.change_type + ' on ' + p.target + '\n'
      + 'against     report build ' + (R.report_build || 'n/a') + '\n'
      + 'then        re-validated against the schema before it is saved';
  }
  paint();

  go.onclick = function () {
    errBox.innerHTML = '';
    if (!who.value.trim()) { errBox.appendChild(el('div', 'err', 'Your name is required — an unsigned decision is not a decision.')); return; }
    if (!why.value.trim()) { errBox.appendChild(el('div', 'err', 'A reason is required. A rejection with a good reason scores as well as an approval — but a decision with no reason is not a record.')); return; }
    localStorage.setItem('loopdesk.who', who.value.trim());
    go.disabled = true;
    go.textContent = 'Writing…';
    fetch('/decision', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prescription_id: p.id, verdict: state.verdict,
                             decided_by: who.value.trim(), reason: why.value.trim(),
                             report_build: R.report_build })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        go.disabled = false;
        go.textContent = 'Confirm';
        if (!res.ok) {
          errBox.appendChild(el('div', 'err', (res.j.error || 'write failed') + ' '
            + (res.j.detail || '') + ' ' + ((res.j.contract || []).join('; '))));
          return;
        }
        closeModal();
        load(function () { showWritten(IDX.presById[p.id], res.j); });
      })
      .catch(function (e) {
        go.disabled = false;
        go.textContent = 'Confirm';
        errBox.appendChild(el('div', 'err', 'Could not reach the server: ' + e
          + '. The page is open without screen/serve.py running, so nothing can be written.'));
      });
  };

  scrim.appendChild(m);
  scrim.onclick = function (e) { if (e.target === scrim) closeModal(); };
  ov.appendChild(scrim);
  who.focus();
}

/* Proof, not assertion: show the actual JSON now sitting in the file. */
function showWritten(p, res) {
  var ov = $('#overlay');
  ov.innerHTML = '';
  var scrim = el('div', 'scrim');
  var m = el('div', 'modal');
  m.appendChild(el('h3', null, 'Written to loop-report.json'));
  m.appendChild(el('p', 'small dim', 'This is the file the judges open. Path: '
    + ((res && res.path) || 'nexus-loop/out/loop-report.json')));
  if (res && res.before) {
    m.appendChild(el('div', 'k', 'Before'));
    m.appendChild(el('div', 'raw', JSON.stringify(res.before, null, 2)));
  } else {
    m.appendChild(el('div', 'k', 'Before'));
    m.appendChild(el('div', 'raw', 'prescriptions[' + p.id + '] had no "approval" key.\n'
      + 'The pipeline never writes one — only this screen may.'));
  }
  m.appendChild(el('div', 'k', 'After'));
  m.appendChild(el('div', 'raw', '"approval": ' + JSON.stringify(p.approval, null, 2)));
  m.appendChild(el('p', 'small dim', 'The report was re-validated against '
    + 'schema/loop-report.schema.json and the project’s contract checks after this was '
    + 'written. If either had failed, nothing would have been saved.'));
  var acts = el('div', 'acts');
  var b = el('button', 'btn pri', 'Close');
  b.type = 'button';
  b.onclick = closeModal;
  acts.appendChild(b);
  m.appendChild(acts);
  scrim.appendChild(m);
  scrim.onclick = function (e) { if (e.target === scrim) closeModal(); };
  ov.appendChild(scrim);
}

/* ---------- WHAT WE THREW AWAY ------------------------------------------------------------ */
/* Staying quiet about a lookalike is not the same as dismissing it. Every one of these was
 * examined and written off in writing, with the cause named. */
function renderDismissals() {
  var s = el('section');
  var h = el('h2', null, 'What we threw away ');
  h.appendChild(el('span', 'cnt', '— ' + IDX.dis.length
    + ' things that looked like problems and were not'));
  s.appendChild(h);
  if (!IDX.dis.length) {
    s.appendChild(el('p', 'dim', 'Nothing was examined and dismissed on this run.'));
    return s;
  }
  IDX.dis.forEach(function (f) {
    var d = IDX.byFinding[f.id] || {};
    var row = el('div', 'dis');
    var hd = el('div', 'hd');
    hd.appendChild(el('span', 'tag grey', '✕ dismissed'));
    var t = el('strong', null, f.title_plain || fallbackTitle(f, d));
    hd.appendChild(t);
    hd.appendChild(el('span', 'tag amber', d.cause_class || '?'));
    row.appendChild(hd);
    row.appendChild(el('div', 'small dim', f.tenant
      + (f.cohort_label && f.cohort_label !== 'this deployment' ? ' · ' + f.cohort_label : '')
      + ' · ' + (f.status_plain || '')));
    if (f.not_a_regression_because) {
      var p = el('p', 'small');
      p.style.marginTop = '8px';
      p.style.maxWidth = '84ch';
      p.textContent = f.not_a_regression_because;
      row.appendChild(p);
    }
    if ((f.evidence || []).length) {
      var det = el('details');
      det.appendChild(el('summary', null, 'Show the measurements behind this'));
      det.appendChild(el('div', 'raw', f.evidence.join('\n')));
      row.appendChild(det);
    }
    s.appendChild(row);
  });
  return s;
}

/* ---------- WHAT WE CANNOT SEE ------------------------------------------------------------ */
/* Permanently on the page. Not a tab, not a modal, not a second screen. */
function renderGaps() {
  var s = el('section');
  var gaps = R.gaps || [];
  var h = el('h2', null, 'What we cannot see ');
  h.appendChild(el('span', 'cnt', '— ' + gaps.length
    + ' question' + (gaps.length === 1 ? '' : 's') + ' we refused to answer'));
  s.appendChild(h);

  var VERD = {
    NOT_MEASURABLE: ['red', 'NOT MEASURABLE'],
    REQUIRES_NEW_JUDGE: ['amber', 'NEEDS A NEW JUDGE'],
    COVERAGE_TOO_LOW: ['amber', 'COVERAGE TOO LOW'],
    CARDINALITY_REFUSED: ['amber', 'REFUSED — CARDINALITY']
  };
  var ASKS = window.ASK_TEXT || {};

  gaps.forEach(function (g) {
    var row = el('div', 'gap');
    var hd = el('div', 'hd');
    hd.style.display = 'flex';
    hd.style.gap = '11px';
    hd.style.alignItems = 'baseline';
    hd.style.flexWrap = 'wrap';
    var q = el('strong', null, '“' + (ASKS[g.ask_id] || ('Operator question ' + g.ask_id)) + '”');
    q.style.fontSize = '15.5px';
    hd.appendChild(q);
    var v = VERD[g.verdict] || ['grey', g.verdict];
    hd.appendChild(el('span', 'tag ' + v[0], v[1]));
    hd.appendChild(el('span', 'small dim', g.ask_id));
    row.appendChild(hd);

    if (g.why) {
      var w = el('p', 'small');
      w.style.marginTop = '9px';
      w.style.maxWidth = '84ch';
      w.textContent = g.why;
      row.appendChild(w);
    }
    /* The seductive wrong answer, and why it misleads. The part most teams omit, and the part
     * that shows the difference between refusing and not bothering. */
    if (g.nearest_proxy) {
      var pr = el('div', 'base');
      pr.style.marginTop = '10px';
      pr.appendChild(el('strong', null, 'The tempting answer is ' + g.nearest_proxy + ' — '));
      pr.appendChild(document.createTextNode(g.why_the_proxy_misleads || ''));
      row.appendChild(pr);
    }
    if (g.required_event) {
      var re = g.required_event;
      var spec = el('div', 'spec');
      spec.appendChild(document.createTextNode('event ' + re.name + ' {\n'));
      (re.fields || []).forEach(function (fl, i) {
        spec.appendChild(document.createTextNode('  ' + fl
          + (i < (re.fields.length - 1) ? ',' : '') + '\n'));
      });
      spec.appendChild(document.createTextNode('}\n'));
      var c1 = el('span', 'c', 'grain: ' + (re.grain || '?') + '   owner: ' + (re.owner || '?'));
      spec.appendChild(c1);
      if (re.calibration_needs) {
        spec.appendChild(document.createTextNode('\n'));
        spec.appendChild(el('span', 'c', 'calibration needs: ' + re.calibration_needs));
      }
      row.appendChild(spec);
      row.appendChild(el('p', 'small dim', 'That turns a gap into a ticket for a named team.'));
    }
    s.appendChild(row);
  });

  /* The cardinality refusal has no ask to hang off, so it would otherwise be invisible. It is
   * the second refusal, and it is a refusal, so it belongs on this panel. */
  var refused = [];
  (R.metrics || []).forEach(function (m) {
    ((m.plan || {}).refused_breakdowns || []).forEach(function (x) {
      if (refused.indexOf(x) < 0) refused.push(x);
    });
  });
  if (refused.length) {
    var row = el('div', 'gap');
    var hd = el('div', 'hd');
    hd.style.display = 'flex';
    hd.style.gap = '11px';
    hd.style.alignItems = 'baseline';
    hd.style.flexWrap = 'wrap';
    var q = el('strong', null, '“Break that down per customer for me.”');
    q.style.fontSize = '15.5px';
    hd.appendChild(q);
    hd.appendChild(el('span', 'tag amber', 'REFUSED — CARDINALITY'));
    row.appendChild(hd);
    var p = el('p', 'small');
    p.style.marginTop = '9px';
    p.style.maxWidth = '84ch';
    p.textContent = 'Refused, not truncated. Silently returning the top 200 of these would look '
      + 'like an answer and would not be one: ' + refused.join('; ') + '.';
    row.appendChild(p);
    s.appendChild(row);
  }
  return s;
}

/* ---------- self-assessment --------------------------------------------------------------- */
function renderSelf() {
  var sa = R.self_assessment;
  if (!sa || !sa.notes) return null;
  var s = el('section');
  s.appendChild(el('h2', null, 'How often we are right'));
  var acc = sa.prescription_accuracy || {};
  var keys = Object.keys(acc);
  if (keys.length) {
    keys.forEach(function (k) {
      var e = acc[k];
      var row = el('div', 'dis');
      var hd = el('div', 'hd');
      hd.appendChild(el('strong', null, k));
      hd.appendChild(el('span', 'small dim', 'n=' + e.n
        + (e.improved != null ? ' · ' + e.improved + ' improved' : '')
        + (e.broke_golden_set ? ' · ' + e.broke_golden_set + ' broke the golden set' : '')));
      if (e.hit_rate != null) hd.appendChild(el('span', 'tag green', 'hit rate ' + fmtPct(e.hit_rate, 0)));
      else hd.appendChild(el('span', 'tag grey', 'hit rate not computed'));
      row.appendChild(hd);
      if (e.hit_rate_declined_because) row.appendChild(el('p', 'small dim', e.hit_rate_declined_because));
      s.appendChild(row);
    });
  }
  var n = el('p', 'small');
  n.style.maxWidth = '84ch';
  n.style.marginTop = '12px';
  n.textContent = sa.notes;
  s.appendChild(n);
  return s;
}

/* ---------- bootstrap --------------------------------------------------------------------- */
function render() {
  var app = $('#app');
  app.innerHTML = '';
  renderSysbar();
  var f = IDX.regs[cur];
  if (!f) {
    var s = el('section');
    s.appendChild(el('h1', null, 'Nothing in this deployment needs a decision.'));
    s.appendChild(el('p', 'dim', 'The scan found no regression. That is a result, not an empty '
      + 'screen — what it examined and dismissed is below, with the reasons.'));
    app.appendChild(s);
  } else {
    app.appendChild(renderFinding(f));
    app.appendChild(renderMeasured(f));
    var w = renderWhy(f);
    if (w) app.appendChild(w);
    var pr = renderPropose(f);
    if (pr) app.appendChild(pr);
  }
  app.appendChild(renderDismissals());
  app.appendChild(renderGaps());
  var sa = renderSelf();
  if (sa) app.appendChild(sa);

  var fr = el('div', 'frozen');
  fr.appendChild(el('span', null, '🔒'));
  fr.appendChild(el('span', null, 'Metric definitions, the judge version and the '
    + 'good-conversation standard are frozen. This system proposes changes to the agent, never to '
    + 'the yardstick. Every number on this page is read from loop-report.json; the screen reads a '
    + 'static report and does not stream.'));
  app.appendChild(fr);
}

function load(then) {
  fetch('/report', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (rep) {
      if (rep && rep.error) throw new Error(rep.error + ' — ' + (rep.hint || rep.detail || ''));
      R = rep;
      IDX = buildIndex(R);
      var want = new URLSearchParams(location.search).get('f');
      if (want) {
        var at = IDX.regs.findIndex(function (x) { return x.id === want; });
        if (at >= 0) cur = at;
      }
      if (cur >= IDX.regs.length) cur = Math.max(0, IDX.regs.length - 1);
      render();
      if (then) then();
    })
    .catch(function (e) {
      $('#app').innerHTML = '<section><h1>No report to read.</h1><p class="dim">' + esc(String(e))
        + '</p><div class="raw">python nexus-loop/run.py --kit kit\n'
        + 'python screen/serve.py --report nexus-loop/out/loop-report.json</div></section>';
    });
}

 * the report answers or refuses; the report stores only their ids. */
